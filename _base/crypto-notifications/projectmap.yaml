shared:
  description: |
    Shared layer contém utilities, traits, tipos e definições de erro
    usados em todas as camadas.

  status: "✅ Implementado"

  modules:
    - errors.rs: |
        ✅ Implementado - Tipos de erro completos
        - DomainError: Validation, NotFound, Concurrency
        - ApplicationError: 
          * Domain, Validation, ChannelError, Formatting
          * Throttled{retry_after}, Kafka, Redis, Telegram
          * Configuration, Database, Internal
        - InfrastructureError: Database, EventStore, Io, Messaging, WebSocket, Kafka, Serialization
        - Type aliases: DomainResult<T>, AppResult<T>, InfraResult<T>
        - Conversões From<> para KafkaError, RedisError, SqlxError, AnyhowError
        - Helper methods: domain(), validation(), channel(), telegram(), redis(), kafka()

