# ============================================================
# SECURITY AND COMPLIANCE
# ============================================================
security:
  authentication:
    strategy: none
    note: "Internal service - no authentication currently implemented"
    provider: none
    token_lifetime: N/A
    refresh_enabled: no

  authorization:
    model: none
    note: "All endpoints are public - designed for internal network use"

  data_protection:
    encryption:
      at_rest: no
      note: "Database contains only subscription metadata, no sensitive data"

      at_transit: yes
      protocol: TLS_1.3
      note: "Binance WebSocket uses WSS (TLS), Kafka can use TLS if configured"

    pii_fields: []
    note: "No personally identifiable information stored or processed"

    data_retention:
      - data_type: kafka_price_updates
        retention_period: 7_days
        deletion_method: automated
        note: "Configured via Kafka topic retention policy"

      - data_type: subscription_metadata
        retention_period: indefinite
        deletion_method: manual
        note: "Only symbol names stored"

  compliance:
    regulations: []
    note: "Market data service - no specific compliance requirements"

    audit_logging:
      enabled: yes
      events_tracked:
        - price_update_published
        - websocket_reconnection
        - subscription_changes
        - error_events
      retention: based_on_log_aggregation_system
      storage: structured_json_logs
      note: "Uses tracing framework with JSON output"

  vulnerabilities:
    scanning_frequency: on_commit
    tools: [cargo-audit, dependabot]
    note: "GitHub Dependabot enabled for dependency scanning"

    known_issues: []

# ============================================================
# TESTING STRATEGY
# ============================================================
testing_strategy:
  test_pyramid:
    unit_tests:
      coverage_target: 70%
      current_coverage: unknown
      framework: cargo_test
      location: src/**/*
      naming_convention: "test_<scenario>_<expected_result>"

      mocking_strategy: manual_mocks
      note: "Minimal unit tests - focus on integration testing"

    integration_tests:
      coverage_target: 60%
      current_coverage: unknown
      location: tests/integration/**

      test_databases:
        - type: postgres_testcontainers
          setup: planned
          cleanup: per_test
          note: "Not yet implemented"

      external_mocks:
        - service: binance_websocket
          tool: manual_mock
          scenarios: [success, disconnect, reconnect]

        - service: kafka
          tool: manual_mock
          verification: call_count

    e2e_tests:
      coverage_target: 30%
      current_coverage: minimal
      location: tests/e2e/**

      test_env:
        deployment: docker-compose
        services: [app, postgres, kafka, binance_mock]
        data_seeding: fixtures

      critical_flows:
        - "Subscribe → Receive WebSocket data → Publish to Kafka"
        - "WebSocket disconnect → Reconnect → Resume publishing"
        - "Filter price updates by threshold"

  test_data_management:
    fixtures:
      location: tests/fixtures/**
      format: rust_factory_functions

      examples:
        - name: valid_subscribe_request
          file: tests/helpers/fixtures.rs
          usage: "HTTP subscription tests"

    factories:
      - name: PriceUpdateFactory
        module: tests::helpers::fixtures
        purpose: "Generate price updates with random valid data"
        customization: "Allows override of symbol, price, timestamp"

  performance_tests:
    load_testing:
      tool: planned
      note: "Performance testing not yet implemented"

    benchmarks:
      framework: none
      location: none
      note: "Benchmarking planned for future"

  mutation_testing:
    tool: none
    note: "Mutation testing not implemented"

# ============================================================
# ERROR HANDLING AND OBSERVABILITY
# ============================================================
error_handling:
  error_hierarchy:
    - name: DomainError
      layer: domain
      variants:
        - Validation
        - NotFound
        - Concurrency
      propagation: "Wrapped by ApplicationError, never exposed directly"

    - name: ApplicationError
      layer: application
      wraps: [DomainError, InfrastructureError]
      variants:
        - Domain
        - Infrastructure
        - Serde
      propagation: "Converts to HTTP status codes in presentation layer"

    - name: InfrastructureError
      layer: infrastructure
      variants:
        - Database
        - EventStore
        - Io
        - Messaging
        - WebSocket
        - Kafka
        - Serialization
      propagation: "Wrapped by ApplicationError"

  error_conversion:
    - from: InfrastructureError::WebSocket
      to: Application continues with reconnection
      message_strategy: log_details
      logged_context: "Reconnection attempt, symbol, error message"

    - from: InfrastructureError::Kafka
      to: Application panic (Kafka required)
      message_strategy: expose_details
      logged_context: "Kafka broker, topic, error"

    - from: InfrastructureError::Database
      to: Application continues with degraded functionality
      message_strategy: log_warning
      logged_context: "Query, error message"

  recovery_strategies:
    - error_type: WebSocketTimeout
      strategy: retry_with_backoff
      max_attempts: 10
      backoff: exponential
      fallback: NoopMarketStream

    - error_type: DatabaseConnectionFailed
      strategy: retry_with_backoff
      max_attempts: 5
      backoff: linear_2000ms
      fallback: continue_without_persistence

    - error_type: KafkaConnectionFailed
      strategy: panic
      max_attempts: N/A
      note: "Kafka is required infrastructure"

  observability:
    logging:
      framework: tracing
      levels:
        - level: ERROR
          conditions: "Unrecoverable errors, max retry attempts reached"
          includes: [error_message, context, symbol]

        - level: WARN
          conditions: "Recoverable errors, retry attempts, degradation"
          includes: [attempt_count, retry_delay, error_type]

        - level: INFO
          conditions: "Lifecycle events, subscriptions, connections"
          includes: [event_type, symbol, timestamp]

        - level: DEBUG
          conditions: "Detailed flow information"
          includes: [websocket_messages, kafka_produce_details]

      structured_logging: yes
      correlation_id: not_implemented
      pii_scrubbing: not_applicable
      note: "JSON structured logs via tracing-subscriber"

    metrics:
      backend: prometheus
      collection_method: /metrics endpoint

      business_metrics:
        - name: listener_published_total
          type: counter
          labels: []
          description: "Total price updates published to Kafka"

        - name: listener_batches_flushed_total
          type: counter
          labels: []
          description: "Total batches flushed"

      technical_metrics:
        - name: listener_reconnects_total
          type: counter
          labels: []
          description: "Total WebSocket reconnections"

        - name: listener_queue_items
          type: gauge
          labels: []
          description: "Current queued items awaiting batch"

        - name: listener_uptime_ms
          type: gauge
          labels: []
          description: "Process uptime in milliseconds"

        - name: listener_sampling_total_events
          type: counter
          labels: []
          description: "Total events considered for log sampling"

        - name: listener_sampling_sampled_events
          type: counter
          labels: []
          description: "Total events actually logged after sampling"

      sli_slo:
        - metric: websocket_reconnection_success_rate
          slo: "> 95%"
          current: unknown

        - metric: kafka_publish_success_rate
          slo: "> 99.9%"
          current: unknown

    tracing:
      backend: none
      note: "Distributed tracing not implemented"

    alerting:
      channels: []
      note: "Alerting not configured - metrics available via Prometheus"

# ============================================================
# DESIGN PATTERNS AND ANTI-PATTERNS
# ============================================================
design_patterns:
  architectural_patterns:
    - pattern: Ports and Adapters (Hexagonal)
      usage: "Isolate application logic from infrastructure"
      locations: [application::ports, infrastructure::messaging, infrastructure::persistence]
      benefits: "Testability, adapter swapping (binance-connector feature)"
      tradeoffs: "More abstractions, trait complexity"

    - pattern: Event-Driven Architecture
      usage: "Price updates flow as events to Kafka"
      locations: [infrastructure::messaging::kafka_price_publisher]
      benefits: "Decoupling, scalability, replay capability"
      tradeoffs: "Eventual consistency, monitoring complexity"

  creational_patterns:
    - pattern: Builder
      usage: "Settings configuration with defaults"
      example_module: infrastructure::config::settings
      scenario: "Complex configuration with multiple optional fields"

    - pattern: Factory
      usage: "Bootstrap modules create and configure components"
      example_module: infrastructure::bootstrap
      scenario: "Database, publisher, market stream initialization"

  behavioral_patterns:
    - pattern: Strategy
      usage: "Feature flag selects WebSocket implementation"
      example_module: infrastructure::messaging::mod
      implementations: [BinanceMarketDataStream, BinanceConnectorMarketDataStream]
      note: "ActiveMarketStream type alias chosen at compile time"

    - pattern: Decorator
      usage: "BatchingPricePublisher wraps KafkaPricePublisher"
      example_module: infrastructure::messaging::batching_price_publisher
      scenario: "Add batching logic without modifying base publisher"

    - pattern: Observer
      usage: "Market stream emits price updates to publisher"
      example_module: infrastructure::messaging::binance_stream
      scenario: "Async stream processing with callbacks"

  anti_patterns:
    known_code_smells:
      - smell: Feature Flag Complexity
        location: infrastructure::messaging::mod
        impact: low
        description: "Two WebSocket implementations with compile-time selection"
        remediation: "Consider runtime strategy pattern if more implementations needed"
        status: acceptable

      - smell: Minimal Domain Layer
        location: domain/*
        impact: medium
        description: "Domain layer mostly empty - business logic in infrastructure"
        remediation: "Acceptable for data pipeline service - no complex domain rules"
        status: acceptable

    architectural_debt:
      - debt: No Distributed Tracing
        affected_modules: [all]
        description: "No correlation IDs or tracing across components"
        impact: "Difficult to debug flow across services"
        effort_estimate: 16h
        priority: medium

      - debt: Limited Test Coverage
        affected_modules: [all]
        description: "Minimal unit and integration tests"
        impact: "Risk of regressions"
        effort_estimate: 40h
        priority: high

  refactoring_queue: []

# ============================================================
# COMMON IMPORTS PER LAYER
# ============================================================
common_imports:
  description: |
    Standard import patterns for crypto-listener Rust project.
    Use this to ensure consistency and avoid dependency violations.

  by_layer:
    domain:
      description: "Domain layer - pure business logic"
      internal_imports:
        - use crate::domain::errors::*;
        - use crate::shared::errors::*;
      
      external_packages:
        allowed:
          - name: chrono
            usage: "Date/time types"
          - name: uuid
            usage: "Unique identifiers"
          - name: serde
            usage: "Serialization for domain events"
          - name: thiserror
            usage: "Domain error definitions"

        forbidden:
          - pattern: sqlx
            reason: "Domain doesn't know about database"
          - pattern: axum
            reason: "Domain doesn't know about HTTP"
          - pattern: rdkafka
            reason: "Domain doesn't know about messaging"
          - pattern: crate::infrastructure
            reason: "Violates dependency inversion"

    application:
      description: "Application layer - use case orchestration"
      internal_imports:
        - use crate::domain::*;
        - use crate::application::ports::*;
        - use crate::application::dtos::*;
        - use crate::shared::errors::*;

      external_packages:
        allowed:
          - name: async_trait
            usage: "Async trait support"
          - name: serde
            usage: "DTO serialization"
          - name: uuid
            usage: "Request IDs"
          - name: chrono
            usage: "Timestamps"

        forbidden:
          - pattern: sqlx
            reason: "Use ports/adapters"
          - pattern: rdkafka
            reason: "Use ports/adapters"
          - pattern: crate::infrastructure
            reason: "Access via port traits only"

    infrastructure:
      description: "Infrastructure layer - technical implementations"
      internal_imports:
        - use crate::application::ports::*;
        - use crate::shared::errors::*;
        - use crate::infrastructure::config::*;

      external_packages:
        allowed:
          - name: sqlx
            usage: "Database access"
          - name: axum
            usage: "HTTP framework (presentation only)"
          - name: rdkafka
            usage: "Kafka client"
          - name: tokio
            usage: "Async runtime"
          - name: tokio_tungstenite
            usage: "WebSocket client"
          - name: tracing
            usage: "Logging"

        forbidden: []

    presentation:
      description: "Presentation layer - HTTP handlers"
      internal_imports:
        - use crate::application::ports::*;
        - use crate::application::dtos::*;

      external_packages:
        allowed:
          - name: axum
            usage: "HTTP routing and handlers"
          - name: serde_json
            usage: "JSON serialization"

        forbidden:
          - pattern: crate::domain::aggregates
            reason: "Use DTOs, not domain entities"

  prelude_pattern:
    description: "No prelude module - explicit imports preferred"
    location: none

# ============================================================
# PROJECT DON'T DO RULES
# ============================================================
project_donts:
  description: |
    Forbidden practices in crypto-listener Rust project.
    These rules must be checked before generating code.

  critical:
    - id: DONT-001
      rule: "NEVER silently ignore errors with let _ = or .ok()"
      reason: "Hides bugs, makes debugging impossible"
      applies_to: [domain, application, infrastructure]
      exceptions: ["Intentional fire-and-forget with documented reason"]
      language_examples:
        rust: |
          // ❌ let _ = do_something();
          // ❌ do_something().ok();
          // ✅ do_something()?;
          // ✅ if let Err(e) = do_something() { tracing::error!("Failed: {e}"); }

    - id: DONT-002
      rule: "NEVER import infrastructure in domain"
      reason: "Violates hexagonal architecture"
      applies_to: [domain]
      language_examples:
        rust: |
          // ❌ use crate::infrastructure::*;
          // ❌ use sqlx::*;
          // ✅ Use traits defined in application::ports

    - id: DONT-003
      rule: "NEVER log full user objects or sensitive data"
      reason: "Potential PII exposure"
      applies_to: [all]
      sensitive_fields: [password, token, api_key, email, user_id]
      language_examples:
        rust: |
          // ❌ tracing::info!("User: {:?}", user);
          // ✅ tracing::info!(user_id = %user.id, "User login");

    - id: DONT-004
      rule: "NEVER hardcode secrets, API keys, or production URLs"
      reason: "Security risk"
      applies_to: [all]
      language_examples:
        rust: |
          // ❌ const API_KEY: &str = "sk_live_abc123";
          // ✅ std::env::var("API_KEY")?;

  high:
    - id: DONT-005
      rule: "NEVER use String for domain concepts - create newtype wrappers"
      reason: "Type safety, prevents mixing symbols with other strings"
      applies_to: [domain, application]
      language_examples:
        rust: |
          // ❌ fn subscribe(symbol: String)
          // ✅ struct Symbol(String); fn subscribe(symbol: Symbol)

    - id: DONT-006
      rule: "NEVER panic in production code except for unrecoverable errors"
      reason: "Crashes the service"
      applies_to: [infrastructure, application]
      exceptions: ["Bootstrap failures where service cannot function"]
      language_examples:
        rust: |
          // ❌ .unwrap()
          // ❌ .expect("message")
          // ✅ .map_err(|e| InfrastructureError::Database(e.to_string()))?

    - id: DONT-007
      rule: "NEVER leave TODO without issue reference"
      reason: "Orphaned TODOs are forgotten"
      applies_to: [all]
      language_examples:
        rust: |
          // ❌ TODO: implement this later
          // ✅ // TODO(#123): implement retry logic

  medium:
    - id: DONT-008
      rule: "AVOID wildcard imports except for well-known preludes"
      reason: "Makes code harder to trace"
      applies_to: [all]
      exceptions: ["std::prelude::*", "test preludes"]
      language_examples:
        rust: |
          // ❌ use crate::domain::*;
          // ✅ use crate::domain::{Aggregate, Event};

    - id: DONT-009
      rule: "AVOID obvious comments that just repeat code"
      reason: "Noise, become stale"
      applies_to: [all]
      language_examples:
        rust: |
          // ❌ // Increment counter
          //    counter += 1;
          // ✅ // Retry limit based on partner SLA
          //    const MAX_RETRIES: u32 = 3;

  project_specific:
    - id: DONT-P001
      rule: "NEVER store price updates in database"
      reason: "Kafka is the single source of truth for price data"
      applies_to: [infrastructure::persistence]
      correct_pattern: |
        // ✅ Publish to Kafka only
        publisher.publish(price_update).await?;
        
        // ❌ Store in database
        // db.insert_price(price_update).await?;

    - id: DONT-P002
      rule: "NEVER disable WebSocket reconnection logic"
      reason: "Service must be resilient to network issues"
      applies_to: [infrastructure::messaging]
      correct_pattern: |
        // ✅ Retry with backoff
        for attempt in 1..=max_attempts {
            match connect().await {
                Ok(conn) => return Ok(conn),
                Err(e) => tracing::warn!("Retry {}/{}", attempt, max_attempts),
            }
        }

# ============================================================
# CONSISTENCY VALIDATION
# ============================================================
consistency_validation:
  description: |
    Validation rules for code generation and projectmap.yaml consistency.

  pre_generation_checks:
    - check: architecture_compliance
      description: "Verify imports respect layer boundaries"
      validation: |
        - domain can import: shared only
        - application can import: domain, shared
        - infrastructure can import: application, domain, shared
        - presentation can import: application, shared

    - check: naming_convention
      description: "Verify snake_case for modules, files, functions"
      validation: |
        - Files: snake_case.rs
        - Modules: snake_case
        - Structs/Enums: PascalCase
        - Functions: snake_case
        - Constants: SCREAMING_SNAKE_CASE

    - check: forbidden_patterns
      description: "Check for forbidden imports"
      validation: |
        - Domain MUST NOT import infrastructure
        - Application MUST NOT import infrastructure directly
        - Check common_imports.by_layer.{{layer}}.external_packages.forbidden

    - check: donts_compliance
      description: "Verify project don'ts are not violated"
      validation: |
        - Check project_donts.critical (BLOCKING)
        - Check project_donts.high (ALERT)
        - Check project_donts.medium (WARNING)

  post_generation_checks:
    - check: error_handling_pattern
      description: "Validate error hierarchy usage"
      validation: |
        - Domain errors must be DomainError variants
        - Infrastructure errors must be InfrastructureError variants
        - Application layer must wrap both with ApplicationError

    - check: test_coverage_impact
      description: "Alert about test coverage"
      validation: |
        - Target: 70% unit test coverage
        - Suggest creating tests for new modules

  cross_reference_validation:
    - rule: modules_exist
      description: "Referenced modules must exist"
      sections: [interactions, api_contracts]

    - rule: endpoints_implemented
      description: "API endpoints must have handlers"
      sections: [api_contracts.rest_api.endpoints]

    - rule: topics_have_schemas
      description: "Kafka topics must have documented schemas"
      sections: [api_contracts.kafka.topics_published]

  output_format:
    on_violation:
      template: |
        ⚠️ VIOLATION DETECTED
        ───────────────────────────────────────
        Rule:     {{rule_id}} - {{rule_description}}
        Severity: {{severity}}
        Location: {{file_path}}:{{line_number}}

        Problem:
        {{violation_description}}

        Suggested fix:
        {{suggested_fix}}
        ───────────────────────────────────────

      severity_actions:
        critical: "STOP generation immediately"
        high: "Alert user, suggest correction"
        medium: "Record as warning, continue"

