---
project:
  name: crypto-listener
  language: Rust
  edition: "2024"
  architecture_style: "Hexagonal (Ports & Adapters)"
  description: |
    Real-time cryptocurrency market data ingestion, normalization, and publishing service.
    Consumes WebSocket streams from Binance, filters price updates, and publishes to Kafka.
    Built with clean architecture principles for testability and extensibility.
    Kafka is the core messaging infrastructure - all price updates flow directly to Kafka topics.
    All Kafka topics follow naming pattern: crypto-listener-{topic-name}

  features:
    default: []
    optional:
      - binance-connector: Uses official Binance Rust connector instead of custom WebSocket

  runtime: "Tokio async (full features)"
  web_framework: "Axum 0.8.6"
  database: "PostgreSQL (used only for subscription persistence)"
  messaging: "Kafka (always enabled, JSON serialization)"
  observability: "tracing + tracing-subscriber (structured JSON logs)"

  documentation:
    location: "docs/"
    conventions:
      - "All technical documentation files must be placed in the docs/ folder"
      - "Use descriptive uppercase names with underscores (e.g., KAFKA_TOPICS_MIGRATION.md)"
      - "Each significant feature, migration, or architectural decision should have its own .md file"
      - "Include date and version information in documentation when relevant"
      - "Migration guides should follow pattern: {FEATURE}_MIGRATION.md"
      - "Architecture decision records should follow pattern: ADR_{NUMBER}_{TITLE}.md"
      - "How-to guides should follow pattern: HOWTO_{TOPIC}.md"

    existing_files:
      - name: KAFKA_TOPICS_MIGRATION.md
        purpose: "Guide for migrating to new Kafka topic naming pattern (crypto-listener-{topic-name})"
        created: "2025-10-16"
        category: migration

  kafka_topics:
    - name: crypto-listener-prices
      description: "Price update events from market data stream"
      message_type: PriceUpdate
      env_var: KAFKA_TOPIC_PRICES
    - name: crypto-listener-subscription-commands
      description: "Commands to subscribe to market data symbols"
      message_type: SubscribeCommand
      env_var: KAFKA_TOPIC_SUBSCRIPTION_COMMANDS
    - name: crypto-listener-unsubscription-commands
      description: "Commands to unsubscribe from market data symbols"
      message_type: UnsubscribeCommand
      env_var: KAFKA_TOPIC_UNSUBSCRIPTION_COMMANDS

naming_style: snake_case

application:
  description: |
    Application layer orchestrates use cases, defines port contracts (traits),
    and provides DTOs for cross-layer communication. This layer is pure business
    logic coordination without infrastructure knowledge.

  naming_style: snake_case

  modules:
    - name: ports
      path: src/application/ports
      purpose: "Port trait definitions (hexagonal architecture contracts)"

      directories:
        - path: src/application/ports
          purpose: "Driving and driven port trait definitions"
          files:
            - mod.rs
            - market_data_stream_port.rs
            - price_publisher_port.rs
            - subscription_store_port.rs
            - event_store.rs
            - projection_store.rs
            - message_bus.rs
          key_types:
            - MarketDataStreamPort
            - PricePublisherPort
            - SubscriptionStorePort
            - EventStore
            - ProjectionStore
            - MessageBus
            - PriceUpdate

      dependencies:
        internal: [shared]
        external: [async-trait, serde]

      exports:
        interfaces:
          - MarketDataStreamPort
          - PricePublisherPort
          - SubscriptionStorePort
        types:
          - PriceUpdate

      complexity: low
      lines_of_code: 120

    - name: dtos
      path: src/application/dtos
      purpose: "Data Transfer Objects for API contracts, layer boundaries, and Kafka commands"

      directories:
        - path: src/application/dtos
          purpose: "Request, response DTOs, and command messages"
          files:
            - mod.rs
            - requests.rs
            - responses.rs
            - commands.rs
          key_types:
            - SubscribeRequest
            - UnsubscribeRequest
            - SubscribeCommand
            - UnsubscribeCommand

      dependencies:
        internal: []
        external: [serde, uuid, chrono]

      exports:
        types:
          - SubscribeRequest
          - UnsubscribeRequest
          - SubscribeCommand
          - UnsubscribeCommand

      complexity: low
      lines_of_code: 90

    - name: services
      path: src/application/services
      purpose: "Application service orchestrators (currently empty, reserved for future use cases)"

      directories:
        - path: src/application/services
          purpose: "Use case orchestration services"
          files: [mod.rs]

      dependencies:
        internal: [ports, dtos]
        external: []

      complexity: low
      lines_of_code: 10

    - name: queries
      path: src/application/queries
      purpose: "Query handlers for read operations (currently empty, reserved for CQRS pattern support)"

      directories:
        - path: src/application/queries
          purpose: "Query definitions and handlers"
          files:
            - mod.rs

      dependencies:
        internal: [ports]
        external: []

      complexity: low
      lines_of_code: 10

  conventions:
    - "All ports are async traits with Send + Sync bounds"
    - "Port methods return InfraResult<T> for infrastructure errors"
    - "DTOs use serde Serialize/Deserialize for JSON compatibility"
    - "PriceUpdate is the canonical type for market data events"
    - "Default trait implementations provide optional hooks (shutdown, flush)"
    - "Kafka is always enabled - no feature flag needed"

  patterns:
    - pattern: Port/Adapter (Hexagonal)
      usage: "Ports define contracts in application layer, adapters implement in infrastructure"
      examples: [MarketDataStreamPort, PricePublisherPort]

  interactions:
    - from: application.ports
      to: infrastructure.messaging
      method: event
      direction: async
      data_format: rust_types

  glossary_refs:
    - term: Port
      relevance: "Defines interface contracts between application and infrastructure"
      usage_locations:
        - src/application/ports/market_data_stream_port.rs
        - src/application/ports/price_publisher_port.rs
    - term: PriceUpdate
      relevance: "Core domain event representing a market price change"
      usage_locations:
        - src/application/ports/price_publisher_port.rs:5-10

  notes:
    - category: architecture
      note: "Services module currently minimal; will expand with complex orchestration use cases"
      priority: low
    - category: future
      note: "Consider adding command handlers alongside queries for full CQRS"
      priority: medium

  quality:
    test_coverage: unknown
    cyclomatic_complexity: low
    coupling: loose
    cohesion: high

domain:
  description: |
    Domain layer contains pure business logic, aggregates, entities, value objects,
    and domain events. Currently minimal as focus is on market data pipeline.
    Reserved for future market-specific domain models.

  naming_style: snake_case

  modules:
    - name: aggregates
      path: src/domain/aggregates
      purpose: "Domain aggregates (currently empty, reserved for market-specific aggregates)"

      directories:
        - path: src/domain/aggregates
          purpose: "Aggregate root entities"
          files:
            - mod.rs

      dependencies:
        internal: [domain.events, shared.traits]
        external: []

      complexity: low
      lines_of_code: 10

    - name: entities
      path: src/domain/entities
      purpose: "Domain entities (currently empty, reserved for market domain models)"

      directories:
        - path: src/domain/entities
          purpose: "Business entities"
          files: [mod.rs]

      complexity: low
      lines_of_code: 10

    - name: events
      path: src/domain/events
      purpose: "Domain events (currently empty, reserved for market-specific events)"

      directories:
        - path: src/domain/events
          purpose: "Event definitions"
          files:
            - mod.rs

      dependencies:
        internal: []
        external: []

      complexity: low
      lines_of_code: 10

    - name: value_objects
      path: src/domain/value_objects
      purpose: "Immutable value objects (currently empty, reserved for market-specific value objects)"

      directories:
        - path: src/domain/value_objects
          purpose: "Domain value types"
          files: [mod.rs]

      complexity: low
      lines_of_code: 10

    - name: errors
      path: src/domain/errors.rs
      purpose: "Domain-level error types"

      dependencies:
        internal: []
        external: [thiserror]

      exports:
        types: [DomainError, DomainResult]

      complexity: low
      lines_of_code: 30

  conventions:
    - "Domain layer has zero infrastructure dependencies"
    - "Aggregates implement AggregateRoot trait from shared layer"
    - "Events are immutable and serializable"
    - "Use thiserror for domain error definitions"

  patterns:
    - pattern: Event Sourcing
      usage: "Reserved for future use - aggregates will emit domain events that represent state changes"
      examples: []

  glossary_refs:
    - term: Aggregate
      relevance: "DDD aggregate root pattern for consistency boundaries"
      usage_locations: []
    - term: DomainEvent
      relevance: "Represents facts that happened in the domain"
      usage_locations: []

  notes:
    - category: architecture
      note: "Domain layer intentionally minimal; most logic is orchestration in infrastructure"
      priority: low
    - category: future
      note: "Add market-specific aggregates like TradingPair, PriceSnapshot, Subscription"
      priority: medium
    - category: simplification
      note: "Removed legacy user aggregate and events - not part of crypto market data pipeline"
      priority: high

  quality:
    test_coverage: unknown
    cyclomatic_complexity: low
    coupling: loose
    cohesion: medium

infrastructure:
  description: |
    Infrastructure layer implements adapters for external systems (Binance WebSocket,
    Kafka, PostgreSQL for subscriptions only). Contains all I/O and framework-specific code.
    Price updates flow directly from Binance to Kafka without database persistence.
    Also includes bootstrap, startup, and shutdown modules for application lifecycle management.
    All Kafka topics follow the naming pattern: crypto-listener-{topic-name}

  naming_style: snake_case

  modules:
    - name: bootstrap
      path: src/infrastructure/bootstrap
      purpose: "Component initialization and dependency bootstrapping with retry logic and fallbacks"

      directories:
        - path: src/infrastructure/bootstrap
          purpose: "Infrastructure component bootstrapping"
          files:
            - mod.rs
            - database.rs
            - publisher.rs
            - market_stream.rs
            - subscription_store.rs
          key_types:
            - DatabaseBootstrap
            - PublisherBootstrap
            - MarketStreamBootstrap
            - SubscriptionStoreBootstrap
            - NoopMarketStream (internal fallback)

      dependencies:
        internal: [application.ports, shared.errors, infrastructure.config, infrastructure.messaging, infrastructure.persistence]
        external: [sqlx, tokio, tracing, async-trait]

      exports:
        types:
          - DatabaseBootstrap
          - PublisherBootstrap
          - MarketStreamBootstrap
          - SubscriptionStoreBootstrap

      complexity: medium
      lines_of_code: 350

      features:
        - "Database connection with configurable retry logic"
        - "Kafka publisher initialization with optional batching wrapper"
        - "Market stream initialization with NoopMarketStream fallback on failure"
        - "Subscription store initialization from database pool"
        - "Automatic reload of persisted subscriptions on startup"
        - "Health check validation for each component"
        - "Structured logging for all bootstrap operations"

      resilience:
        database:
          retry_attempts: "Configurable via max_connect_attempts (default: 5)"
          retry_delay: "Configurable via connect_retry_delay_ms (default: 2000ms)"
          behavior: "Logs warnings on retry, continues without DB if all attempts fail"
        market_stream:
          fallback: "NoopMarketStream - logs warnings but doesn't crash application"
          behavior: "Validates health after creation, uses fallback on failure"
        publisher:
          behavior: "Panics if Kafka unavailable - Kafka is required infrastructure"

      notes:
        - category: architecture
          note: "Bootstrap modules separate initialization concerns from business logic"
          priority: high
        - category: resilience
          note: "Fallback implementations ensure application starts even with partial failures"
          priority: high

    - name: startup
      path: src/infrastructure/startup
      purpose: "Application startup configuration, health checks, and user feedback"

      directories:
        - path: src/infrastructure/startup
          purpose: "Startup sequence coordination"
          files:
            - mod.rs
            - logging.rs
            - banner.rs
            - health.rs
          key_types:
            - LoggingSetup
            - StartupBanner
            - HealthSummary
            - ComponentHealth

      dependencies:
        internal: [application.ports]
        external: [tracing, tracing-subscriber, sqlx]

      exports:
        types:
          - LoggingSetup
          - StartupBanner
          - HealthSummary
          - ComponentHealth

      complexity: low
      lines_of_code: 150

      features:
        - "Structured JSON logging initialization with environment-based filtering"
        - "Visual startup banner with component health status (✓ OK / ✗ UNAVAILABLE)"
        - "Aggregated health checks for all infrastructure components"
        - "Detailed logging of component availability"

      notes:
        - category: operations
          note: "Banner provides immediate visual feedback on system health at startup"
          priority: high
        - category: observability
          note: "JSON logs with structured fields enable better monitoring and debugging"
          priority: high

    - name: shutdown
      path: src/infrastructure/shutdown
      purpose: "Graceful shutdown coordination with signal handling and resource cleanup"

      directories:
        - path: src/infrastructure/shutdown
          purpose: "Shutdown sequence orchestration"
          files:
            - mod.rs
            - signal_handler.rs
            - graceful.rs
          key_types:
            - SignalHandler
            - GracefulShutdown

      dependencies:
        internal: [application.ports]
        external: [tokio, tracing]

      exports:
        types:
          - SignalHandler
          - GracefulShutdown

      complexity: low
      lines_of_code: 180

      features:
        - "OS signal handling (SIGTERM, SIGINT/Ctrl+C)"
        - "Cross-platform support (Unix and Windows)"
        - "Sequential shutdown with configurable timeouts (default: 5s)"
        - "Publisher flush before shutdown to prevent data loss"
        - "Detailed logging of shutdown sequence"
        - "Timeout handling for unresponsive components"

      shutdown_sequence:
        1: "Wait for shutdown signal"
        2: "Flush publisher (with timeout)"
        3: "Shutdown publisher (with timeout)"
        4: "Shutdown market stream (with timeout)"
        5: "Log completion"

      notes:
        - category: reliability
          note: "Graceful shutdown prevents data loss by flushing buffers before exit"
          priority: high
        - category: kubernetes
          note: "Proper SIGTERM handling enables zero-downtime deployments"
          priority: high

    - name: messaging
      path: src/infrastructure/messaging
      purpose: "Market data streams and Kafka publishing adapters with robust reconnection logic"

      directories:
        - path: src/infrastructure/messaging
          purpose: "WebSocket adapters and Kafka publishers with automatic retry and recovery"
          files:
            - mod.rs
            - binance_stream.rs
            - binance_connector_stream.rs
            - kafka_price_publisher.rs
            - batching_price_publisher.rs
            - metrics.rs
          key_types:
            - BinanceMarketDataStream
            - BinanceConnectorMarketDataStream
            - KafkaPricePublisher
            - BatchingPricePublisher
            - Metrics

      directories_kafka:
        - path: src/infrastructure/messaging/kafka
          purpose: "Modular Kafka infrastructure"
          files:
            - mod.rs
            - common.rs
          subdirectories:
            - producers/
            - consumers/

      dependencies:
        internal: [application.ports, shared.errors]
        external:
          - tokio
          - tokio-tungstenite
          - futures
          - rdkafka
          - reqwest
          - binance_connector_rust (optional, binance-connector feature)
          - once_cell
          - parking_lot

      exports:
        types:
          - ActiveMarketStream (alias to feature-selected implementation)
          - Metrics
          - METRICS (static singleton)

      complexity: high
      lines_of_code: 700

      resilience:
        reconnection:
          max_attempts: "Configurable via MARKET_WS_MAX_RECONNECT_ATTEMPTS (default: 10)"
          delay_ms: "Configurable via MARKET_WS_RECONNECT_DELAY_MS (default: 5000)"
          behavior: |
            - Tracks reconnection attempts independently for connection failures and disconnections
            - Resets counter to 0 on successful connection
            - Logs each retry attempt with current attempt number and max attempts
            - On successful reconnection, automatically re-subscribes to all active symbols
            - If max attempts reached, logs error and terminates application (exit code 1)
          configuration:
            - ws_max_reconnect_attempts: "Number of retry attempts before giving up"
            - ws_reconnect_delay_ms: "Delay in milliseconds between retry attempts"

    - name: persistence
      path: src/infrastructure/persistence
      purpose: "Database adapter for subscription persistence only"

      directories:
        - path: src/infrastructure/persistence
          purpose: "PostgreSQL repository for subscriptions"
          files:
            - mod.rs
            - postgres_market_state_store.rs
          key_types:
            - PostgresMarketStateStore

      dependencies:
        internal: [application.ports, shared.errors]
        external: [sqlx, tokio]

      exports:
        types:
          - PostgresMarketStateStore

      complexity: low
      lines_of_code: 80

    - name: config
      path: src/infrastructure/config
      purpose: "Configuration management and settings"

      directories:
        - path: src/infrastructure/config
          purpose: "Application configuration"
          files:
            - mod.rs
            - settings.rs
          key_types:
            - Settings
            - AppConfig
            - DatabaseConfig
            - MarketConfig
            - KafkaConfig
            - TopicsConfig

      dependencies:
        internal: []
        external: [serde, config]

      exports:
        types:
          - Settings
          - TopicsConfig

      complexity: low
      lines_of_code: 220

      features:
        - "Environment-based configuration loading"
        - "Nested configuration structures"
        - "Support for multiple Kafka topics with naming pattern: crypto-listener-{topic-name}"
        - "Support for multiple Kafka producers/consumers"
        - "Validation on load"
        - "TopicsConfig centralizes all Kafka topic names"
        - "Environment variables: KAFKA_TOPIC_PRICES, KAFKA_TOPIC_SUBSCRIPTION_COMMANDS, KAFKA_TOPIC_UNSUBSCRIPTION_COMMANDS"

  conventions:
    - "All infrastructure types implement application ports (traits)"
    - "Use Arc<Self> for shared ownership across async tasks"
    - "Graceful shutdown hooks via shutdown() method on ports"
    - "Health checks return InfraResult for readiness probes"
    - "Batching adapters use decorator pattern over base publishers"
    - "Feature flags control optional dependencies (binance-connector only)"
    - "Kafka is always enabled and required for the application to run"
    - "No database persistence of price data - all updates go to Kafka"
    - "Generic Kafka producers/consumers use type parameters for message types"
    - "Pluggable serialization via MessageSerializer/MessageDeserializer traits"
    - "Multiple producers/consumers configured via HashMap in Settings"
    - "Kafka configs stored in Settings with named keys (e.g., kafka_producers.prices)"
    - "Bootstrap modules handle all initialization with retry logic and fallbacks"
    - "Startup modules provide observability and user feedback"
    - "Shutdown modules ensure graceful resource cleanup"
    - "All Kafka topics follow naming pattern: crypto-listener-{topic-name}"
    - "TopicsConfig provides centralized topic name management"

  patterns:
    - pattern: Adapter Pattern
      usage: "Infrastructure types adapt external systems to port interfaces"
      examples:
        - binance_stream.rs
        - kafka_price_publisher.rs
        - postgres_market_state_store.rs

    - pattern: Decorator Pattern
      usage: "Batching decorator adds buffering logic transparently for Kafka publishing"
      examples:
        - batching_price_publisher.rs
        - kafka/producers/batching_producer.rs

    - pattern: Strategy Pattern
      usage: "Feature flags select implementation at compile time (ActiveMarketStream alias); Pluggable serializers for Kafka messages"
      examples:
        - messaging/mod.rs
        - kafka/common.rs (MessageSerializer/Deserializer)

    - pattern: Singleton Pattern
      usage: "Global metrics instance via Lazy static"
      examples: [metrics.rs]

    - pattern: Generic Programming
      usage: "Type-safe Kafka producers/consumers for any message type"
      examples:
        - kafka/producers/base_producer.rs (KafkaProducer<T, S>)
        - kafka/consumers/base_consumer.rs (KafkaConsumer<T, D, H>)

    - pattern: Observer Pattern
      usage: "MessageHandler processes consumed Kafka messages"
      examples:
        - kafka/consumers/subscription_consumer.rs

    - pattern: Builder Pattern
      usage: "Fluent component initialization in bootstrap modules"
      examples:
        - bootstrap/database.rs
        - bootstrap/publisher.rs

    - pattern: Null Object Pattern
      usage: "NoopMarketStream provides safe fallback when WebSocket unavailable"
      examples:
        - bootstrap/market_stream.rs

  interactions:
    - from: infrastructure.messaging.binance_stream
      to: external.binance
      method: websocket
      protocol: wss
      direction: async
      data_format: json
    - from: infrastructure.messaging.kafka_price_publisher
      to: external.kafka
      method: kafka
      direction: async
      data_format: json
    - from: infrastructure.persistence
      to: external.postgres
      method: db
      protocol: postgres
      direction: sync
      data_format: sql
      note: "Only for subscription persistence"
    - from: infrastructure.messaging.batching_price_publisher
      to: infrastructure.messaging.kafka_price_publisher
      method: event
      direction: async
      data_format: rust_types
    - from: infrastructure.bootstrap
      to: infrastructure.messaging
      method: initialization
      direction: sync
      note: "Bootstraps and validates components"
    - from: infrastructure.startup
      to: infrastructure.bootstrap
      method: orchestration
      direction: sync
      note: "Coordinates startup sequence"
    - from: infrastructure.shutdown
      to: application.ports
      method: cleanup
      direction: async
      note: "Graceful shutdown via port interfaces"

  glossary_refs:
    - term: Adapter
      relevance: "Implements port interface for external system"
      usage_locations: [src/infrastructure/messaging/, src/infrastructure/persistence/]
    - term: Batching
      relevance: "Accumulates events before flushing to reduce Kafka produce operations"
      usage_locations:
        - src/infrastructure/messaging/batching_price_publisher.rs
    - term: WebSocket
      relevance: "Real-time bidirectional protocol for Binance market data"
      usage_locations: [src/infrastructure/messaging/binance_stream.rs]
    - term: Bootstrap
      relevance: "Component initialization with dependency injection and retry logic"
      usage_locations: [src/infrastructure/bootstrap/]
    - term: Graceful Shutdown
      relevance: "Clean resource cleanup with flushing and timeouts"
      usage_locations: [src/infrastructure/shutdown/graceful.rs]

  notes:
    - category: performance
      note: "Batching reduces Kafka produce calls by accumulating updates; configurable via batch_interval_ms and batch_max_size"
      priority: high
    - category: architecture
      note: "Kafka is required infrastructure - application will panic if Kafka bootstrap fails"
      priority: high
    - category: architecture
      note: "Feature flag (binance-connector) controls WebSocket adapter implementation at compile time"
      priority: medium
    - category: simplification
      note: "Removed price persistence to database - Kafka is the single source of truth for price updates"
      priority: high
    - category: future
      note: "Add circuit breaker for Binance WebSocket reconnection logic"
      priority: medium
    - category: security
      note: "WebSocket connections use TLS (rustls-tls-native-roots)"
      priority: low
    - category: architecture
      note: "Bootstrap, startup, and shutdown modules follow single responsibility principle"
      priority: high
    - category: resilience
      note: "NoopMarketStream fallback prevents application crash when WebSocket unavailable"
      priority: high
    - category: operations
      note: "Startup banner provides immediate visibility into component health"
      priority: high
    - category: reliability
      note: "Graceful shutdown with flush prevents data loss during restarts"
      priority: high
    - category: naming
      note: "All Kafka topics follow pattern crypto-listener-{topic-name} for namespace isolation"
      priority: high
    - category: configuration
      note: "Multiple topics supported via KAFKA_TOPIC_* environment variables and TopicsConfig struct"
      priority: high

  quality:
    test_coverage: unknown
    cyclomatic_complexity: medium
    coupling: moderate
    cohesion: high

presentation:
  description: |
    Presentation layer handles HTTP API endpoints for subscription management,
    health checks, and metrics. Built with Axum framework for async request handling.
    Provides REST API for external clients to control market data subscriptions.

  naming_style: snake_case

  modules:
    - name: http
      path: src/presentation/http
      purpose: "HTTP API with REST endpoints for subscription management and health monitoring"

      directories:
        - path: src/presentation/http
          purpose: "HTTP routing, controllers, middleware, and response handling"
          files:
            - mod.rs
            - router.rs
            - responses.rs
          key_types:
            - AppState
            - ApiResponse
            - ErrorResponse

        - path: src/presentation/http/controllers
          purpose: "HTTP request handlers (currently minimal, logic in router)"
          files:
            - mod.rs

        - path: src/presentation/http/middleware
          purpose: "HTTP middleware for logging and request processing"
          files:
            - mod.rs
            - logging.rs
          key_types:
            - LoggingMiddleware

      dependencies:
        internal: [application.ports, application.dtos, infrastructure.messaging.metrics, shared.utils]
        external: [axum, serde_json, tokio]

      exports:
        types:
          - app_router
          - AppState
          - ApiResponse

      complexity: medium
      lines_of_code: 220

      features:
        - "REST endpoints: POST /market/subscribe, POST /market/unsubscribe"
        - "Read endpoints: GET /market/subscriptions, POST /market/subscriptions/clear"
        - "Health endpoints: GET /health, GET /ready"
        - "Metrics endpoint: GET /metrics (Prometheus-compatible text format)"
        - "Sampled logging for high-frequency subscribe/unsubscribe operations"
        - "Generic AppState with dependency injection for ports"
        - "Typed JSON request/response handling"

      endpoints:
        - path: "/market/subscribe"
          method: POST
          purpose: "Subscribe to market data symbol"
          request_type: SubscribeRequest
          response_type: "ApiResponse<String>"

        - path: "/market/unsubscribe"
          method: POST
          purpose: "Unsubscribe from market data symbol"
          request_type: UnsubscribeRequest
          response_type: "ApiResponse<String>"

        - path: "/market/subscriptions"
          method: GET
          purpose: "List active subscriptions"
          response_type: "ApiResponse<Vec<String>>"

        - path: "/market/subscriptions/clear"
          method: POST
          purpose: "Clear all subscriptions"
          response_type: "ApiResponse<String>"

        - path: "/health"
          method: GET
          purpose: "Health check with metrics snapshot"
          response_type: "ApiResponse<Value>"

        - path: "/ready"
          method: GET
          purpose: "Readiness probe for Kubernetes"
          response_type: "ApiResponse<Value>"

        - path: "/metrics"
          method: GET
          purpose: "Prometheus-compatible metrics"
          response_type: "text/plain"

  conventions:
    - "All handlers are async functions with Axum extractors"
    - "AppState uses Arc for shared access across handlers"
    - "Error responses use consistent ErrorResponse wrapper"
    - "Success responses use ApiResponse<T> generic wrapper"
    - "High-frequency operations use sampled logging to reduce log volume"
    - "Health checks delegate to port health_check() methods"
    - "Metrics exposed in Prometheus text format for observability"

  patterns:
    - pattern: Dependency Injection
      usage: "AppState injects port implementations into handlers via Axum State extractor"
      examples:
        - router.rs (AppState struct)

    - pattern: Result Wrapper
      usage: "ApiResponse<T> wraps success/error responses uniformly"
      examples:
        - responses.rs

  interactions:
    - from: presentation.http
      to: application.ports
      method: REST
      direction: sync
      note: "HTTP handlers call port methods"

    - from: presentation.http
      to: infrastructure.messaging.metrics
      method: event
      direction: sync
      note: "Expose METRICS singleton via /metrics endpoint"

  glossary_refs:
    - term: REST
      relevance: "HTTP API design pattern for resource operations"
      usage_locations:
        - src/presentation/http/router.rs

    - term: HealthCheck
      relevance: "Kubernetes liveness and readiness probes"
      usage_locations:
        - src/presentation/http/router.rs

  notes:
    - category: observability
      note: "Sampled logging prevents log flooding from high-frequency subscription changes"
      priority: high
    - category: operations
      note: "Prometheus metrics enable Grafana dashboards and alerting"
      priority: high
    - category: kubernetes
      note: "/ready endpoint used for pod readiness, /health for liveness"
      priority: high

  quality:
    test_coverage: unknown
    cyclomatic_complexity: low
    coupling: loose
    cohesion: high

shared:
  description: |
    Shared layer provides cross-cutting concerns: error types, common traits,
    utility functions, and type definitions used across all layers.
    Contains no business logic, only reusable technical infrastructure.

  naming_style: snake_case

  modules:
    - name: errors
      path: src/shared/errors.rs
      purpose: "Hierarchical error types for domain, application, and infrastructure layers"

      directories:
        - path: src/shared
          purpose: "Error type definitions with thiserror derives"
          files:
            - errors.rs
          key_types:
            - DomainError
            - ApplicationError
            - InfrastructureError
            - DomainResult
            - AppResult
            - InfraResult

      dependencies:
        internal: []
        external: [thiserror, serde_json]

      exports:
        types:
          - DomainError
          - ApplicationError
          - InfrastructureError
          - DomainResult
          - AppResult
          - InfraResult

      complexity: low
      lines_of_code: 30

    - name: types
      path: src/shared/types.rs
      purpose: "Common type definitions for event sourcing and domain modeling"

      directories:
        - path: src/shared
          purpose: "Shared type definitions"
          files:
            - types.rs
          key_types:
            - EventVersion
            - EventMetadata
            - EventEnvelope
            - Versioned

      dependencies:
        internal: []
        external: [uuid, chrono, serde]

      exports:
        types:
          - EventVersion
          - EventMetadata
          - EventEnvelope
          - Versioned

      complexity: low
      lines_of_code: 40

    - name: traits
      path: src/shared/traits
      purpose: "Common trait definitions (currently minimal, reserved for cross-cutting traits)"

      directories:
        - path: src/shared/traits
          purpose: "Reusable trait definitions"
          files:
            - mod.rs

      dependencies:
        internal: []
        external: []

      complexity: low
      lines_of_code: 10

    - name: utils
      path: src/shared/utils
      purpose: "Utility functions for datetime handling, validation, and log sampling"

      directories:
        - path: src/shared/utils
          purpose: "Helper functions and utilities"
          files:
            - mod.rs
            - datetime.rs
            - validation.rs
            - log_sampling.rs
          key_types:
            - sampled_subscribe
            - sampled_unsubscribe

      dependencies:
        internal: []
        external: [chrono, tracing, parking_lot]

      exports:
        functions:
          - sampled_subscribe
          - sampled_unsubscribe

      complexity: low
      lines_of_code: 120

      features:
        - "Log sampling with configurable rate (default: 1 in 100)"
        - "Thread-safe sampling counters with parking_lot"
        - "DateTime utilities for timestamp handling"
        - "Validation helpers for input sanitization"

  conventions:
    - "Error types use thiserror for automatic Display/Error implementations"
    - "Result type aliases (DomainResult, AppResult, InfraResult) simplify signatures"
    - "Error hierarchy follows layer boundaries (domain -> application -> infrastructure)"
    - "Shared types are immutable and serializable where possible"
    - "Utilities are pure functions without side effects (except logging)"
    - "Log sampling prevents log flooding in high-throughput scenarios"

  patterns:
    - pattern: Error Hierarchy
      usage: "Layered error types with From conversions for error propagation"
      examples:
        - errors.rs (DomainError -> ApplicationError -> InfrastructureError)

    - pattern: Type Alias
      usage: "Result<T, E> aliases reduce boilerplate"
      examples:
        - errors.rs (DomainResult, AppResult, InfraResult)

  interactions:
    - from: shared.errors
      to: domain
      method: event
      direction: sync
      note: "Domain uses DomainError and DomainResult"

    - from: shared.errors
      to: application
      method: event
      direction: sync
      note: "Application uses ApplicationError, InfraResult"

    - from: shared.errors
      to: infrastructure
      method: event
      direction: sync
      note: "Infrastructure uses InfrastructureError, InfraResult"

    - from: shared.utils
      to: presentation.http
      method: event
      direction: sync
      note: "HTTP handlers use sampled logging functions"

  glossary_refs:
    - term: ErrorHierarchy
      relevance: "Layered error types enable proper error handling at each architectural layer"
      usage_locations:
        - src/shared/errors.rs

    - term: LogSampling
      relevance: "Rate-limited logging for high-frequency events"
      usage_locations:
        - src/shared/utils/log_sampling.rs

  notes:
    - category: architecture
      note: "Shared layer has no dependencies on other layers - only external crates"
      priority: high
    - category: performance
      note: "Log sampling reduces I/O overhead for high-frequency operations"
      priority: medium
    - category: future
      note: "Consider adding more reusable traits as patterns emerge"
      priority: low

  quality:
    test_coverage: unknown
    cyclomatic_complexity: low
    coupling: none
    cohesion: medium

infrastructure.messaging.kafka:
  description: |
    Modular Kafka infrastructure providing generic, type-safe producers and consumers
    with pluggable serialization. Supports JSON, Avro, and Protobuf formats.
    Designed for reusability across multiple message types and topics.

  naming_style: snake_case

  modules:
    - name: common
      path: src/infrastructure/messaging/kafka/common.rs
      purpose: "Shared types and serialization traits for Kafka messaging"

      directories:
        - path: src/infrastructure/messaging/kafka
          purpose: "Common Kafka types and serialization contracts"
          files:
            - common.rs
          key_types:
            - KafkaMessage
            - SerializationFormat
            - MessageSerializer
            - MessageDeserializer
            - JsonSerializer
            - JsonDeserializer

      dependencies:
        internal: [shared.errors]
        external: [serde, serde_json]

      exports:
        types:
          - KafkaMessage
          - SerializationFormat
          - MessageSerializer
          - MessageDeserializer
          - JsonSerializer
          - JsonDeserializer

      complexity: low
      lines_of_code: 70

      features:
        - "Generic KafkaMessage<T> wrapper with key, value, headers"
        - "Builder pattern for message construction (with_key, with_header)"
        - "Pluggable serialization via MessageSerializer<T> trait"
        - "Pluggable deserialization via MessageDeserializer<T> trait"
        - "Built-in JSON serializer/deserializer implementations"
        - "Support for Avro and Protobuf (format enumeration)"

    - name: producers
      path: src/infrastructure/messaging/kafka/producers
      purpose: "Generic Kafka producer implementations with batching support"

      directories:
        - path: src/infrastructure/messaging/kafka/producers
          purpose: "Producer infrastructure with base and specialized implementations"
          files:
            - mod.rs
            - base_producer.rs
            - batching_producer.rs
            - price_producer.rs
          key_types:
            - KafkaProducerPort
            - KafkaProducer
            - BatchingKafkaProducer
            - KafkaPriceProducer

      dependencies:
        internal: [application.ports, shared.errors, infrastructure.messaging.kafka.common, infrastructure.messaging.kafka.config]
        external: [rdkafka, tokio, async-trait, tracing]

      exports:
        types:
          - KafkaProducerPort
          - KafkaProducer
          - BatchingKafkaProducer
          - KafkaPriceProducer

      complexity: high
      lines_of_code: 450

      features:
        - "Generic KafkaProducer<T, S> with type-safe message and serializer parameters"
        - "Async channel-based message queue for non-blocking sends"
        - "Background task for message publishing with retry logic"
        - "Configurable batch size, linger time, compression, idempotence"
        - "Bootstrap with retry attempts and backoff delays"
        - "Batching decorator accumulates messages before flush"
        - "Health checks validate producer connectivity"
        - "Graceful shutdown with flush guarantee"

    - name: consumers
      path: src/infrastructure/messaging/kafka/consumers
      purpose: "Generic Kafka consumer implementations with message handler pattern"

      directories:
        - path: src/infrastructure/messaging/kafka/consumers
          purpose: "Consumer infrastructure with base and specialized implementations"
          files:
            - mod.rs
            - base_consumer.rs
            - subscription_consumer.rs
          key_types:
            - KafkaConsumerPort
            - MessageHandler
            - KafkaConsumer
            - SubscriptionCommandConsumer

      dependencies:
        internal: [application.ports, shared.errors, infrastructure.messaging.kafka.common, infrastructure.messaging.kafka.config]
        external: [rdkafka, tokio, async-trait, tracing]

      exports:
        types:
          - KafkaConsumerPort
          - MessageHandler
          - KafkaConsumer

      complexity: high
      lines_of_code: 380

      features:
        - "Generic KafkaConsumer<T, D, H> with message type, deserializer, and handler parameters"
        - "MessageHandler<T> trait for pluggable message processing logic"
        - "Background task for continuous message consumption"
        - "Configurable consumer group, auto-commit, offset reset strategy"
        - "Multi-topic subscription support"
        - "Start/stop lifecycle management with running flag"
        - "Health checks validate consumer connectivity"
        - "Error handling with structured logging"

    - name: config
      path: src/infrastructure/messaging/kafka/config.rs
      purpose: "Configuration structures for Kafka producers and consumers"

      directories:
        - path: src/infrastructure/messaging/kafka
          purpose: "Kafka configuration types"
          files:
            - config.rs
          key_types:
            - KafkaProducerConfig
            - KafkaConsumerConfig

      dependencies:
        internal: []
        external: [serde]

      exports:
        types:
          - KafkaProducerConfig
          - KafkaConsumerConfig

      complexity: low
      lines_of_code: 120

      features:
        - "Serde-compatible config structures for environment loading"
        - "Producer config: brokers, topic, batch_size, linger_ms, compression, acks, idempotence"
        - "Consumer config: brokers, topics, group_id, auto_offset_reset, enable_auto_commit"
        - "Accessor methods with sensible defaults"
        - "Retry configuration: max_retry_attempts, retry_backoff"

  conventions:
    - "All producers/consumers are generic over message types"
    - "Serialization is pluggable via MessageSerializer/Deserializer traits"
    - "Type safety enforced at compile time via generic parameters"
    - "Bootstrap methods use Arc<Self> for shared ownership"
    - "Background tasks spawned with tokio::spawn for async processing"
    - "Health checks validate connectivity without message operations"
    - "Configuration uses builder pattern with defaults"
    - "Error handling uses InfraResult from shared.errors"

  patterns:
    - pattern: Generic Programming
      usage: "Type-safe message producers/consumers for any serializable type"
      examples:
        - KafkaProducer<T, S>
        - KafkaConsumer<T, D, H>

    - pattern: Dependency Injection
      usage: "Serializers and handlers injected as generic parameters"
      examples:
        - MessageSerializer<T>
        - MessageHandler<T>

    - pattern: Decorator Pattern
      usage: "BatchingKafkaProducer wraps base producer with buffering logic"
      examples:
        - batching_producer.rs

    - pattern: Strategy Pattern
      usage: "Pluggable serialization strategies (JSON, Avro, Protobuf)"
      examples:
        - MessageSerializer trait with JsonSerializer implementation

    - pattern: Observer Pattern
      usage: "MessageHandler processes consumed messages"
      examples:
        - base_consumer.rs (MessageHandler<T> trait)

  interactions:
    - from: infrastructure.messaging.kafka.producers
      to: external.kafka
      method: kafka
      direction: async
      note: "Publish messages to Kafka topics"

    - from: infrastructure.messaging.kafka.consumers
      to: external.kafka
      method: kafka
      direction: async
      note: "Consume messages from Kafka topics"

    - from: infrastructure.messaging.kafka
      to: infrastructure.messaging.kafka.common
      method: event
      direction: sync
      note: "Use serialization traits and message wrappers"

  glossary_refs:
    - term: KafkaProducer
      relevance: "Generic producer implementation with type-safe message publishing"
      usage_locations:
        - src/infrastructure/messaging/kafka/producers/base_producer.rs

    - term: KafkaConsumer
      relevance: "Generic consumer implementation with pluggable message handling"
      usage_locations:
        - src/infrastructure/messaging/kafka/consumers/base_consumer.rs

    - term: MessageSerializer
      relevance: "Trait for converting messages to bytes for Kafka publishing"
      usage_locations:
        - src/infrastructure/messaging/kafka/common.rs

    - term: MessageDeserializer
      relevance: "Trait for converting bytes to messages from Kafka consumption"
      usage_locations:
        - src/infrastructure/messaging/kafka/common.rs

    - term: MessageHandler
      relevance: "Trait for processing consumed Kafka messages"
      usage_locations:
        - src/infrastructure/messaging/kafka/consumers/base_consumer.rs

  notes:
    - category: architecture
      note: "Generic Kafka infrastructure enables reuse for any message type"
      priority: high
    - category: extensibility
      note: "Pluggable serialization supports JSON, Avro, Protobuf formats"
      priority: high
    - category: performance
      note: "Batching producer reduces Kafka produce calls for high-throughput scenarios"
      priority: high
    - category: resilience
      note: "Bootstrap retry logic handles transient Kafka connection failures"
      priority: high
    - category: type_safety
      note: "Compile-time type checking prevents runtime serialization errors"
      priority: high

  quality:
    test_coverage: unknown
    cyclomatic_complexity: medium
    coupling: loose
    cohesion: high

# ============================================================
# API AND CONTRACTS MAP
# ============================================================
api_contracts:
  description: |
    Complete mapping of all REST endpoints and Kafka topics in the crypto-listener system.
    Price updates flow from Binance WebSocket → Kafka topics.
    HTTP API manages subscriptions to market data symbols.

  # ─────────────────────────────────────────────────────────
  # REST ENDPOINTS
  # ─────────────────────────────────────────────────────────
  rest_api:
    base_url: http://localhost:8080
    version: v1
    default_content_type: application/json

    authentication:
      type: none
      note: "Currently no authentication - designed for internal service use"

    endpoints:
      # ── Market Subscriptions ────────────────────────────
      - path: /market/subscribe
        method: POST
        summary: "Subscribe to market data symbol"
        owner_module: presentation::http::router::subscribe_symbol
        auth_required: false
        
        request:
          content_type: application/json
          body_schema: |
            {
              "symbol": "string"  // required, e.g., "BTCUSDT"
            }
          validation_rules:
            - "symbol cannot be empty"

        responses:
          - status: 200
            description: "Successfully subscribed"
            body_schema: |
              {
                "success": true,
                "data": "subscribed BTCUSDT"
              }
          - status: 500
            description: "Subscribe error"
            error_code: "SUBSCRIBE_ERROR"

        side_effects:
          - "Connects to Binance WebSocket for symbol"
          - "Persists subscription to PostgreSQL if store enabled"
          - "Emits sampled log entry (1 in 100)"

      - path: /market/unsubscribe
        method: POST
        summary: "Unsubscribe from market data symbol"
        owner_module: presentation::http::router::unsubscribe_symbol
        auth_required: false
        
        request:
          content_type: application/json
          body_schema: |
            {
              "symbol": "string"  // required
            }

        responses:
          - status: 200
            description: "Successfully unsubscribed"
            body_schema: |
              {
                "success": true,
                "data": "unsubscribed BTCUSDT"
              }
          - status: 500
            description: "Unsubscribe error"

        side_effects:
          - "Disconnects from Binance WebSocket for symbol"
          - "Removes subscription from PostgreSQL if store enabled"
          - "Emits sampled log entry (1 in 100)"

      - path: /market/subscriptions
        method: GET
        summary: "List all active subscriptions"
        owner_module: presentation::http::router::get_subscriptions
        auth_required: false
        
        responses:
          - status: 200
            body_schema: |
              {
                "success": true,
                "data": ["BTCUSDT", "ETHUSDT"]
              }
          - status: 500
            description: "Database error"

      - path: /market/subscriptions/clear
        method: POST
        summary: "Clear all subscriptions"
        owner_module: presentation::http::router::clear_subscriptions
        auth_required: false
        
        responses:
          - status: 200
            description: "All subscriptions cleared"
          - status: 500
            description: "Clear error"

        side_effects:
          - "Unsubscribes from all WebSocket connections"
          - "Clears all subscriptions from database"

      # ── Health Checks ───────────────────────────────────
      - path: /health
        method: GET
        summary: "Health check with metrics snapshot"
        owner_module: presentation::http::router::health
        auth_required: false
        
        responses:
          - status: 200
            body_schema: |
              {
                "success": true,
                "data": {
                  "status": "ok",
                  "metrics": {
                    "published": 0,
                    "batches_flushed": 0,
                    "reconnects": 0,
                    "queued": 0,
                    "uptime_ms": 12345,
                    "sampling_total_events": 100,
                    "sampling_sampled_events": 1
                  }
                }
              }

      - path: /ready
        method: GET
        summary: "Readiness probe for Kubernetes"
        owner_module: presentation::http::router::ready
        auth_required: false
        
        responses:
          - status: 200
            description: "Service ready"
            body_schema: |
              {
                "success": true,
                "data": {
                  "status": "ready"
                }
              }
          - status: 503
            description: "Service not ready (Kafka or WebSocket unavailable)"

      - path: /metrics
        method: GET
        summary: "Prometheus-compatible metrics"
        owner_module: presentation::http::router::metrics
        auth_required: false
        
        responses:
          - status: 200
            content_type: text/plain; version=0.0.4
            description: "Prometheus metrics in text format"
            body_schema: |
              # HELP listener_published_total Total price updates published
              # TYPE listener_published_total counter
              listener_published_total 0
              # HELP listener_batches_flushed_total Total batches flushed
              # TYPE listener_batches_flushed_total counter
              listener_batches_flushed_total 0
              # HELP listener_reconnects_total Total websocket reconnects
              # TYPE listener_reconnects_total counter
              listener_reconnects_total 0
              # HELP listener_queue_items Current queued items awaiting batch
              # TYPE listener_queue_items gauge
              listener_queue_items 0
              # HELP listener_uptime_ms Process uptime in milliseconds
              # TYPE listener_uptime_ms gauge
              listener_uptime_ms 12345
              # HELP listener_sampling_total_events Total events considered for sampling
              # TYPE listener_sampling_total_events counter
              listener_sampling_total_events 100
              # HELP listener_sampling_sampled_events Total events that were actually sampled/logged
              # TYPE listener_sampling_sampled_events counter
              listener_sampling_sampled_events 1

    error_format:
      schema: |
        {
          "success": false,
          "error": {
            "error": "Human readable message"
          }
        }

  # ─────────────────────────────────────────────────────────
  # KAFKA TOPICS
  # ─────────────────────────────────────────────────────────
  kafka:
    cluster: crypto-listener-cluster
    bootstrap_servers: ["kafka:9092"]
    
    naming_convention: "crypto-listener-{topic-name}"
    
    default_config:
      partitions: 3
      replication_factor: 1
      retention_ms: 604800000  # 7 days
      cleanup_policy: delete

    serialization:
      key: string  # Symbol name
      value: json
      schema_registry: "Schema registry optional, not currently used"

    # ── TOPICS PUBLISHED (Producer) ─────────────────────
    topics_published:
      - topic: crypto-listener-prices
        description: "Real-time price updates from Binance market data"
        owner_module: infrastructure::messaging::kafka_price_publisher
        
        trigger: "Price change from Binance WebSocket exceeds min_price_change_percent threshold"
        frequency: "High volume - varies by market activity (potentially 100s/sec)"
        
        partitioning:
          strategy: by_key
          key: symbol
          reason: "Ensure ordered delivery per trading pair"
        
        schema:
          version: v1
          fields:
            - name: symbol
              type: string
              required: true
              description: "Trading pair (e.g., BTCUSDT)"
            - name: price
              type: string
              required: true
              description: "Current price as decimal string"
            - name: event_time
              type: integer
              required: true
              description: "Binance event timestamp (milliseconds)"
            - name: last_price_change_percent
              type: number
              required: false
              description: "Price change percentage"
        
        consumers:
          - service: downstream-analytics
            consumer_group: analytics-prices
            purpose: "Price analytics and reporting"
          - service: downstream-alerting
            consumer_group: alerting-prices
            purpose: "Price alert triggers"

      - topic: crypto-listener-subscription-commands
        description: "Commands to subscribe to market data symbols"
        owner_module: application::dtos::commands::SubscribeCommand
        
        trigger: "External service needs to subscribe to symbol"
        frequency: "Low - manual or scheduled subscription changes"
        
        schema:
          version: v1
          fields:
            - name: symbol
              type: string
              required: true
              description: "Trading pair to subscribe"
            - name: request_id
              type: string
              required: true
              description: "UUID for request tracking"
            - name: timestamp
              type: integer
              required: true
              description: "Command timestamp (milliseconds)"
            - name: user_id
              type: string
              required: false
              description: "Optional user identifier"
        
        consumers:
          - service: crypto-listener
            consumer_group: listener-subscription-handler
            purpose: "Process subscription commands"

      - topic: crypto-listener-unsubscription-commands
        description: "Commands to unsubscribe from market data symbols"
        owner_module: application::dtos::commands::UnsubscribeCommand
        
        trigger: "External service needs to unsubscribe from symbol"
        frequency: "Low - manual or scheduled subscription changes"
        
        schema:
          version: v1
          fields:
            - name: symbol
              type: string
              required: true
              description: "Trading pair to unsubscribe"
            - name: request_id
              type: string
              required: true
              description: "UUID for request tracking"
            - name: timestamp
              type: integer
              required: true
              description: "Command timestamp (milliseconds)"
            - name: user_id
              type: string
              required: false
              description: "Optional user identifier"
        
        consumers:
          - service: crypto-listener
            consumer_group: listener-unsubscription-handler
            purpose: "Process unsubscription commands"

    # ── TOPICS CONSUMED (Consumer) ─────────────────────
    topics_consumed: []
    note: "crypto-listener is primarily a producer service - consumers TBD"

    # ── MONITORING ─────────────────────────────────────
    monitoring:
      consumer_lag_alert:
        warning_threshold: 1000
        critical_threshold: 10000
        
      throughput_baseline:
        crypto-listener-prices: "Varies by market activity"

# ============================================================
# DATA AND MODELS MAP
# ============================================================
data_model:
  persistence_strategy: hybrid
  note: "Event sourcing infrastructure present but minimal domain usage. Subscriptions use CRUD."

  entities:
    - name: PriceUpdate
      type: value_object
      layer: application
      description: "Immutable price update event from market data stream"

      attributes:
        - name: symbol
          type: String
          nullable: false
          indexed: true
          pii: false
        - name: price
          type: String
          nullable: false
          indexed: false
          pii: false
          note: "Decimal stored as string to avoid floating-point precision issues"
        - name: event_time
          type: i64
          nullable: false
          indexed: false
          pii: false
          note: "Milliseconds since epoch"
        - name: last_price_change_percent
          type: Option<f64>
          nullable: true
          indexed: false
          pii: false

      events_emitted: []
      note: "PriceUpdate is the core data type - published to Kafka immediately"

  dtos:
    - name: SubscribeRequest
      layer: presentation
      purpose: "HTTP API request to subscribe to symbol"
      source: HTTP POST /market/subscribe
      target: MarketDataStreamPort
      mappings:
        - from: json.symbol
          to: dto.symbol

    - name: UnsubscribeRequest
      layer: presentation
      purpose: "HTTP API request to unsubscribe from symbol"
      source: HTTP POST /market/unsubscribe
      target: MarketDataStreamPort
      mappings:
        - from: json.symbol
          to: dto.symbol

    - name: SubscribeCommand
      layer: application
      purpose: "Kafka command message for subscription"
      source: Kafka topic crypto-listener-subscription-commands
      target: MarketDataStreamPort
      mappings:
        - from: kafka.symbol
          to: command.symbol
        - from: kafka.request_id
          to: command.request_id
        - from: kafka.timestamp
          to: command.timestamp
        - from: kafka.user_id
          to: command.user_id

    - name: UnsubscribeCommand
      layer: application
      purpose: "Kafka command message for unsubscription"
      source: Kafka topic crypto-listener-unsubscription-commands
      target: MarketDataStreamPort
      mappings:
        - from: kafka.symbol
          to: command.symbol

  database_schemas:
    - schema_name: public
      database: PostgreSQL
      tables:
        - name: events
          primary_key: [id]
          foreign_keys: []
          indexes:
            - columns: [aggregate_id]
              type: btree
            - columns: [aggregate_id, sequence]
              type: unique
          partitioning: none
          estimated_rows: 0
          growth_rate: none
          note: "Event store table - currently unused in production flow"

        - name: users_projection
          primary_key: [user_id]
          foreign_keys: []
          indexes: []
          partitioning: none
          estimated_rows: 0
          growth_rate: none
          note: "Projection table - currently unused"

        - name: market_subscriptions
          primary_key: [symbol]
          foreign_keys: []
          indexes: []
          partitioning: none
          estimated_rows: 100
          growth_rate: low
          note: "Stores active symbol subscriptions for recovery after restart"

  data_migrations:
    - id: V001__initial_schema
      applied_at: "Project inception"
      description: "Initial event store schema"
      rollback_available: no

    - id: V002__market_state_store
