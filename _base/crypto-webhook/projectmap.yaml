  description: |
    Production-ready webhook microservice for crypto trading ecosystem.
    Receives webhooks from external sources (TradingView, Discord, Custom),
    validates, normalizes, and publishes trading signals to Kafka.
    
    Part of a 5-service ecosystem:
    1. crypto-webhook (THIS) - Receives and normalizes webhooks
    2. crypto-trader - Executes trading orders
    3. crypto-signals - Market analysis
    4. crypto-notifications - Alert delivery
    5. crypto-management - Configuration management

  implementation_status:
