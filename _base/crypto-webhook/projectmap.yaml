  conventions:
    - "All infrastructure types implement application ports (traits)"
    - "Use Arc<Self> for shared ownership across async tasks"
    - "Graceful shutdown hooks via shutdown() method on ports"
    - "Health checks return InfraResult for readiness probes"
    - "ConnectionManager for Redis with automatic reconnection"
    - "Lua scripts for atomic Redis operations"
    - "Retry policies handle transient failures with exponential backoff"
    - "HMAC secrets configured per source"

  interactions:
    - from: messaging
      to: kafka
      method: kafka
      description: "Publishes Avro/JSON signals to Kafka topics (signals.buy, signals.sell)"
    - from: repositories
      to: database
      method: db
      description: "Persists webhook audit trail to PostgreSQL"
    - from: rate_limiting
      to: cache
      method: cache
      description: "Stores rate limit counters in Redis with expiration"
    - from: replay_prevention
      to: cache
      method: cache
      description: "Stores request signatures in Redis for replay detection"
    - from: bootstrap
      to: retry
      method: direct_call
      description: "Uses retry policy for component initialization"

  glossary_refs:
    - term: Avro
      usage: "AvroSignalPublisher serializes signals to Apache Avro binary format"
      relevance: "42% smaller messages, schema evolution support"
    - term: HMAC
      usage: "HmacAuthenticator validates webhook signatures"
      relevance: "Ensures webhooks are from trusted sources"
    - term: Redis
      usage: "RedisRateLimiter, RedisReplayDetector for stateful operations"
      relevance: "Enables horizontal scaling with shared state"
    - term: Kafka
      usage: "All signal publishers send to Kafka topics"
      relevance: "Decouples webhook ingestion from downstream processing"

presentation:
  description: |
    Presentation layer handles HTTP endpoints, routing, middleware, and request/response
    handling. Built with Axum web framework. Includes webhook handlers, health checks,
    and HMAC validation middleware for authentication.

  naming_style: snake_case

  modules:
    - name: handlers
      path: src/presentation/http/handlers
      purpose: "HTTP request handlers for webhook endpoints and health checks"

      directories:
        - path: handlers/
          purpose: "HTTP endpoint handlers"
          files:
            - tradingview_handler.rs
            - mod.rs

      key_types:
        - name: AppState
          kind: struct
          purpose: "Shared application state for dependency injection"
        - name: handle_tradingview_webhook
          kind: function
          purpose: "POST /webhook/tradingview handler"
        - name: handle_health_check
          kind: function
          purpose: "GET /health handler"

      dependencies:
        internal:
          - services
          - dtos
          - normalizers
        external:
          - axum
          - serde_json
          - tracing

      notes:
        - "🔄 Evolução: Add Discord and Custom webhook handlers when needed"

    - name: middleware
      path: src/presentation/http/middleware
      purpose: "HTTP middleware for cross-cutting concerns"

      directories:
        - path: middleware/
          purpose: "Axum middleware components"
          files:
            - hmac_middleware.rs
            - mod.rs

      key_types:
        - name: HmacMiddlewareState
          kind: struct
          purpose: "HMAC middleware configuration state"
        - name: hmac_validation_middleware
          kind: function
          purpose: "HMAC signature validation middleware"

      dependencies:
        internal:
          - authentication
        external:
          - axum
          - tracing

      notes:
        - "✅ Created in Phase 3"
        - "🏗️ Arquitetura: Validates HMAC before handler execution"

    - name: router
      path: src/presentation/http
      purpose: "Axum router configuration with all endpoint definitions"

      directories:
        - path: http/
          purpose: "HTTP layer root with router"
          files:
            - router.rs
            - mod.rs

      key_types:
        - name: create_router
          kind: function
          purpose: "Creates configured Axum router with all routes"

      dependencies:
        internal:
          - handlers
          - middleware
        external:
          - axum

      notes:
        - "🏗️ Arquitetura: Single router creation function for all endpoints"

  conventions:
    - "Handlers are async functions compatible with Axum"
    - "Use State<Arc<AppState>> for dependency injection"
    - "Middleware validates before handler execution"
    - "Return proper HTTP status codes (200, 400, 401, 500)"
    - "Extract Bearer token and HMAC signature from headers"
    - "Use Json<T> for request/response bodies"
    - "Structured error responses with ErrorResponse DTO"

  interactions:
    - from: handlers
      to: services
      method: direct_call
      description: "Handlers call WebhookService to process webhooks"
    - from: middleware
      to: authentication
      method: direct_call
      description: "HMAC middleware validates signatures via HmacAuthenticator"
    - from: router
      to: handlers
      method: direct_call
      description: "Router maps HTTP paths to handler functions"

  glossary_refs:
    - term: Webhook
      usage: "Handlers process incoming webhook HTTP requests"
      relevance: "Entry point for external trading signals via HTTP"
    - term: HMAC
      usage: "Middleware validates HMAC signatures in headers"
      relevance: "Ensures request authenticity and integrity"

shared:
  description: |
    Shared layer contains cross-cutting utilities and types used across all layers.
    Includes error types, common traits, utility functions for datetime, validation,
    and shared type aliases. This layer has no business logic and serves as a
    foundation for domain, application, and infrastructure layers.

  naming_style: snake_case

  modules:
    - name: errors
      path: src/shared
      purpose: "Structured error types using thiserror for all layers"

      directories:
        - path: shared/
          purpose: "Shared error definitions"
          files:
            - errors.rs

      key_types:
        - name: DomainError
          kind: enum
          purpose: "Domain-level errors (Validation, NotFound, Concurrency, DatabaseError)"
        - name: ApplicationError
          kind: enum
          purpose: "Application-level errors (includes Domain, Infrastructure, ValidationError, AuthenticationFailed, RateLimitExceeded, ReplayDetected)"
        - name: InfrastructureError
          kind: enum
          purpose: "Infrastructure-level errors (Database, Kafka, Redis, Serialization, Connection)"
        - name: DomainResult
          kind: type
          purpose: "Type alias for Result<T, DomainError>"
        - name: ApplicationResult
          kind: type
          purpose: "Type alias for Result<T, ApplicationError>"
        - name: InfraResult
          kind: type
          purpose: "Type alias for Result<T, InfrastructureError>"

      dependencies:
        internal: []
        external:
          - thiserror

      notes:
        - "🏗️ Arquitetura: Three-tier error hierarchy matches layer separation"
        - "🏗️ Arquitetura: ApplicationError wraps both Domain and Infrastructure errors"

    - name: types
      path: src/shared
      purpose: "Common type aliases and shared type definitions"

      directories:
        - path: shared/
          purpose: "Shared type definitions"
          files:
            - types.rs

      dependencies:
        internal: []
        external:
          - serde

      notes:
        - "📋 TODO: Currently minimal, expand as needed"

    - name: utils
      path: src/shared/utils
      purpose: "Utility functions for datetime and validation"

      directories:
        - path: utils/
          purpose: "Utility function modules"
          files:
            - datetime.rs
            - validation.rs
            - mod.rs

      key_types:
        - name: datetime
          kind: module
          purpose: "DateTime utility functions (now, parsing, formatting)"
        - name: validation
          kind: module
          purpose: "Validation utility functions (email, url, etc.)"

      dependencies:
        internal: []
        external:
          - chrono

      notes:
        - "🏗️ Arquitetura: Pure utility functions, no state"

    - name: traits
      path: src/shared/traits
      purpose: "Shared traits used across multiple layers"

      directories:
        - path: traits/
          purpose: "Common trait definitions"
          files:
            - mod.rs

      dependencies:
        internal: []
        external: []

      notes:
        - "📋 TODO: Placeholder for future shared traits"
        - "🔄 Evolução: May add common traits like ToJson, FromJson, etc."

  conventions:
    - "Error types use thiserror for derive macros"
    - "Result type aliases (DomainResult, ApplicationResult, InfraResult)"
    - "Error conversion using From trait (DomainError → ApplicationError)"
    - "Utility functions are pure and stateless"
    - "No business logic in shared layer"
    - "Keep dependencies minimal"

  interactions:
    - from: errors
      to: all_layers
      method: direct_call
      description: "All layers use error types for error handling"

  glossary_refs:
    - term: Error
      usage: "Three-tier error hierarchy: Domain, Application, Infrastructure"
      relevance: "Structured error handling matching architectural layers"

database:
