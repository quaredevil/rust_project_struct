naming_style: snake_case

application:
  description: |
    Application layer orchestrates webhook processing use cases, defines port contracts (traits),
    and provides DTOs for cross-layer communication. Includes webhook normalizers for multiple
    sources, schema validation, and service orchestration. This layer implements hexagonal
    architecture ports pattern, defining interfaces that infrastructure adapters must implement.

  naming_style: mixed

  modules:
    - name: ports
      path: src/application/ports
      purpose: |
        Defines port trait contracts for hexagonal architecture. Infrastructure adapters
        implement these traits to provide concrete functionality for external systems.

      directories:
        - path: ports/
          purpose: "Port trait definitions for infrastructure adapters"
          files:
            - signal_publisher_port.rs
            - rate_limiter_port.rs
            - replay_detector_port.rs
            - event_store.rs
            - projection_store.rs
            - mod.rs

      key_types:
        - name: SignalPublisherPort
          kind: trait
          purpose: "Publish trading signals to Kafka topics"
        - name: RateLimiterPort
          kind: trait
          purpose: "Check and enforce rate limits per source"
        - name: ReplayDetectorPort
          kind: trait
          purpose: "Detect and prevent replay attacks"
        - name: EventStore
          kind: trait
          purpose: "Event store port for future event sourcing"
        - name: ProjectionStore
          kind: trait
          purpose: "Projection store port for future CQRS"

      dependencies:
        internal:
          - dtos
        external:
          - async-trait
          - serde
          - serde_json

    - name: dtos
      path: src/application/dtos
      purpose: |
        Data Transfer Objects for API contracts and layer boundaries. DTOs are AVRO-compliant
        for Kafka serialization and use serde for JSON compatibility.

      directories:
        - path: dtos/
          purpose: "DTO definitions for cross-layer communication"
          files:
            - signal_dto.rs
            - tradingview_payload_dto.rs
            - responses.rs
            - mod.rs

      key_types:
        - name: SignalDTO
          kind: struct
          purpose: "AVRO-compliant trading signal DTO"
        - name: TradingViewPayloadDTO
          kind: struct
          purpose: "TradingView webhook payload structure"
        - name: WebhookResponse
          kind: struct
          purpose: "Successful webhook response"
        - name: ErrorResponse
          kind: struct
          purpose: "Error response structure"
        - name: HealthResponse
          kind: struct
          purpose: "Health check response"

      dependencies:
        internal: []
        external:
          - serde
          - serde_json
          - chrono
          - uuid

    - name: normalizers
      path: src/application/normalizers
      purpose: |
        Webhook normalizers transform source-specific payloads into normalized SignalDTOs.
        Implements plugin pattern via WebhookNormalizer trait for extensibility.

      directories:
        - path: normalizers/
          purpose: "Source-specific webhook normalizers"
          files:
            - normalizer_trait.rs
            - tradingview.rs
            - discord.rs
            - custom.rs
            - mod.rs

      key_types:
        - name: WebhookNormalizer
          kind: trait
          purpose: "Normalizer contract for webhook sources"
        - name: TradingViewNormalizer
          kind: struct
          purpose: "TradingView webhook normalizer"
        - name: DiscordNormalizer
          kind: struct
          purpose: "Discord webhook normalizer"
        - name: CustomNormalizer
          kind: struct
          purpose: "Custom format webhook normalizer"

      dependencies:
        internal:
          - dtos
        external:
          - async-trait
          - serde_json

    - name: validation
      path: src/application/validation
      purpose: |
        JSON Schema validation for incoming webhook payloads. Validates against predefined
        Draft 7 schemas before normalization to ensure data integrity.

      directories:
        - path: validation/
          purpose: "JSON Schema validation components"
          files:
            - schema_validator.rs
            - mod.rs

      key_types:
        - name: SchemaValidator
          kind: struct
          purpose: "JSON Schema Draft 7 validator with schema registry"

      dependencies:
        internal: []
        external:
          - jsonschema
          - serde_json
          - tracing

    - name: services
      path: src/application/services
      purpose: |
        Application services orchestrate use case workflows. WebhookService coordinates
        the entire webhook processing pipeline from validation to publishing.

      directories:
        - path: services/
          purpose: "Application service orchestrators"
          files:
            - webhook_service.rs
            - mod.rs

      key_types:
        - name: WebhookService
          kind: struct
          purpose: "End-to-end webhook processing orchestrator"

      dependencies:
        internal:
          - ports
          - dtos
          - normalizers
        external:
          - tracing
          - serde_json

    - name: queries
      path: src/application/queries
      purpose: "Query handlers for read operations (CQRS pattern)"

      directories:
        - path: queries/
          purpose: "Placeholder for future read model queries"
          files:
            - mod.rs

      dependencies:
        internal: []
        external: []

      notes:
        - "📋 TODO: Implement query handlers when read models are needed"
        - "🔄 Evolução: Part of future CQRS implementation"

  conventions:
    - "All ports are async traits with Send + Sync bounds"
    - "Port methods return ApplicationResult<T> or InfraResult<T>"
    - "DTOs use serde Serialize/Deserialize for JSON compatibility"
    - "Normalizers return tuple (SignalDTO, String) where String is side (BUY/SELL)"
    - "Schema validation occurs before normalization"
    - "All async operations use tokio runtime"
    - "Errors use thiserror for structured error types"
    - "Tracing for observability in service layer"

  interactions:
    - from: services
      to: ports
      method: direct_call
      description: "WebhookService calls port traits for infrastructure operations"
    - from: services
      to: normalizers
      method: direct_call
      description: "WebhookService delegates payload normalization to normalizers"
    - from: normalizers
      to: dtos
      method: direct_call
      description: "Normalizers construct and return SignalDTO instances"
    - from: validation
      to: dtos
      method: direct_call
      description: "SchemaValidator validates JSON payloads before DTO creation"

  glossary_refs:
