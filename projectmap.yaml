# ============================================================
# SECTION 18: IMPORTS AND DEPENDENCIES COMMON PER LAYER
# ============================================================
common_imports:
  description: |
    Standard import patterns for Rust template following hexagonal architecture.
    These rules enforce the dependency inversion principle.

  by_layer:
    domain:
      description: "Domain layer - pure business logic"
      internal_imports:
        - "use crate::domain::value_objects::*;"
        - "use crate::domain::events::*;"
        - "use crate::domain::errors::*;"
        
      external_packages:
        allowed:
          - name: uuid
            usage: "Unique identifiers for aggregates/entities"
          - name: chrono
            usage: "Date and time handling"
          - name: serde
            usage: "Serialization for events"
          - name: thiserror
            usage: "Error definitions"
            
        forbidden:
          - pattern: "sqlx|diesel|sea_orm"
            reason: "Domain must not know about databases"
          - pattern: "axum|actix_web|rocket"
            reason: "Domain must not know about HTTP"
          - pattern: "rdkafka|lapin"
            reason: "Domain must not know about messaging"
          - pattern: "crate::infrastructure"
            reason: "Violates dependency inversion"

    application:
      description: "Application layer - use case orchestration"
      internal_imports:
        - "use crate::application::ports::*;"
        - "use crate::application::dtos::*;"
        - "use crate::domain::*;"
        - "use crate::shared::errors::*;"
        
      external_packages:
        allowed:
          - name: async_trait
            usage: "Async trait methods"
          - name: tokio
            usage: "Async runtime"
          - name: serde
            usage: "DTO serialization"
          - name: tracing
            usage: "Structured logging"
            
        forbidden:
          - pattern: "sqlx|diesel"
            reason: "Use ports/traits, not concrete implementations"
          - pattern: "rdkafka"
            reason: "Use ports/traits, not concrete implementations"
          - pattern: "crate::infrastructure::repositories"
            reason: "Access via port traits only"

    infrastructure:
      description: "Infrastructure layer - technical implementations"
      internal_imports:
        - "use crate::application::ports::*;"
        - "use crate::domain::*;"
        - "use crate::shared::errors::*;"
        - "use crate::infrastructure::config::*;"
        
      external_packages:
        allowed:
          - name: sqlx
            usage: "PostgreSQL database access"
          - name: rdkafka
            usage: "Kafka client"
          - name: tokio
            usage: "Async runtime"
          - name: serde
            usage: "Serialization"
          - name: serde_json
            usage: "JSON serialization"
          - name: async_trait
            usage: "Implementing async port traits"
          - name: tracing
            usage: "Logging and instrumentation"
            
        forbidden: []

    shared:
      description: "Shared layer - cross-cutting concerns"
      internal_imports: []
      
      external_packages:
        allowed:
          - name: thiserror
            usage: "Error definitions"
          - name: uuid
            usage: "Common types"
          - name: chrono
            usage: "Common types"
          - name: serde
            usage: "Serialization traits"
            
        forbidden:
          - pattern: "sqlx|rdkafka|axum"
            reason: "Shared should be technology-agnostic"

  prelude_pattern:
    description: "No prelude pattern in this template"
    location: "N/A"
    example: "Users can add prelude module if desired"

# ============================================================
# SECTION 19: PROJECT "DON'T DO" RULES
# ============================================================
project_donts:
  description: |
    Critical rules for maintaining hexagonal architecture integrity.
    These must be enforced during code review.

  critical:
    - id: DONT-001
      rule: "NEVER import infrastructure in domain layer"
      reason: "Violates hexagonal architecture and dependency inversion"
      applies_to: [domain]
      exceptions: []
      language_examples:
        rust: |
          // ❌ WRONG - in src/domain/
          use crate::infrastructure::repositories::PostgresRepository;
          use sqlx::PgPool;
          use rdkafka::producer::FutureProducer;
          
          // ✅ CORRECT - in src/domain/
          use crate::domain::value_objects::Email;
          use uuid::Uuid;
          use chrono::DateTime;
          
    - id: DONT-002
      rule: "NEVER put business logic in DTOs"
      reason: "DTOs are data containers, not domain objects"
      applies_to: [application]
      exceptions: []
      language_examples:
        rust: |
          // ❌ WRONG
          impl UserDTO {
              fn validate_email(&self) -> bool {
                  // business logic in DTO
              }
          }
          
          // ✅ CORRECT
          impl UserDTO {
              // Just serialization/deserialization
          }
          // Business logic in domain::value_objects::Email
          
    - id: DONT-003
      rule: "NEVER silently ignore errors with unwrap() or expect() in production code"
      reason: "Causes panics and crashes - use proper error handling"
      applies_to: [domain, application, infrastructure]
      exceptions: ["Tests", "Main function initialization"]
      language_examples:
        rust: |
          // ❌ WRONG
          let config = Settings::load().unwrap();
          let result = do_something().expect("failed");
          
          // ✅ CORRECT
          let config = Settings::load()
              .map_err(|e| InfrastructureError::Config(e.to_string()))?;
          let result = do_something()?;
          
    - id: DONT-004
      rule: "NEVER hardcode secrets, credentials, or environment-specific URLs"
      reason: "Security risk and breaks environment portability"
      applies_to: [domain, application, infrastructure]
      exceptions: []
      language_examples:
        rust: |
          // ❌ WRONG
          const DATABASE_URL: &str = "postgres://user:pass@localhost/db";
          const API_KEY: &str = "sk_live_abc123";
          
          // ✅ CORRECT
          let database_url = std::env::var("DATABASE_URL")?;
          let api_key = std::env::var("API_KEY")?;
          // Or use Settings::load()

  high:
    - id: DONT-005
      rule: "AVOID primitive obsession - use value objects"
      reason: "Validation scattered everywhere, no type safety"
      applies_to: [domain]
      exceptions: ["Internal implementation details"]
      language_examples:
        rust: |
          // ❌ AVOID
          fn create_user(email: String, age: u32) -> User { ... }
          
          // ✅ PREFER
          fn create_user(email: Email, age: Age) -> User { ... }
          // Where Email and Age are value objects with validation
          
    - id: DONT-006
      rule: "AVOID implementing port traits in domain layer"
      reason: "Ports belong to application layer, implementations in infrastructure"
      applies_to: [domain]
      exceptions: []
      language_examples:
        rust: |
          // ❌ WRONG - in domain layer
          impl Repository<User> for UserRepository { ... }
          
          // ✅ CORRECT
          // Port trait defined in: application::ports
          // Implementation in: infrastructure::repositories
          
    - id: DONT-007
      rule: "AVOID public mutable state"
      reason: "Breaks encapsulation and makes testing difficult"
      applies_to: [domain, application]
      exceptions: []
      language_examples:
        rust: |
          // ❌ AVOID
          pub struct Order {
              pub status: OrderStatus,  // public mutable
          }
          
          // ✅ PREFER
          pub struct Order {
              status: OrderStatus,  // private
          }
          impl Order {
              pub fn status(&self) -> OrderStatus { ... }
              pub fn cancel(&mut self) -> Result<()> { ... }
          }
          
    - id: DONT-008
      rule: "AVOID Clone without reason"
      reason: "Performance overhead, especially for large types"
      applies_to: [domain, application, infrastructure]
      exceptions: ["Genuinely need owned copy"]
      language_examples:
        rust: |
          // ❌ AVOID
          fn process(data: Vec<u8>) {
              let copy = data.clone();  // unnecessary
              use_data(&copy);
          }
          
          // ✅ PREFER
          fn process(data: &[u8]) {  // borrow
              use_data(data);
          }

  medium:
    - id: DONT-009
      rule: "AVOID wildcard imports except for common preludes"
      reason: "Makes code harder to understand and navigate"
      applies_to: [domain, application, infrastructure]
      exceptions: ["std::prelude::*", "Custom prelude modules"]
      language_examples:
        rust: |
          // ❌ AVOID
          use crate::domain::*;
          use uuid::*;
          
          // ✅ PREFER
          use crate::domain::aggregates::Order;
          use uuid::Uuid;
          
    - id: DONT-010
      rule: "AVOID overly generic names"
      reason: "Unclear purpose, hard to search"
      applies_to: [domain, application, infrastructure]
      exceptions: []
      language_examples:
        rust: |
          // ❌ AVOID
          struct Manager { ... }
          struct Handler { ... }
          struct Service { ... }
          
          // ✅ PREFER
          struct OrderManager { ... }
          struct PaymentEventHandler { ... }
          struct UserAuthenticationService { ... }

  project_specific:
    - id: DONT-P001
      rule: "DON'T add business logic to this template"
      reason: "This is a generic template - domain logic belongs in user implementations"
      applies_to: [domain]
      correct_pattern: |
        Keep domain modules empty as structure for users to fill.
        Add examples in docs/ but not in src/domain/.

# ============================================================
# SECTION 20: CONSISTENCY VALIDATION
# ============================================================
consistency_validation:
  description: |
    Validation rules for maintaining architectural consistency.
    These should be checked in code review or automated linting.

  pre_generation_checks:
    - check: "architecture_compliance"
      description: "Verify imports respect layer boundaries"
      validation: |
        For each Rust file:
        1. Identify layer from file path (src/domain/, src/application/, etc.)
        2. Parse use statements
        3. Check against allowed imports in common_imports
        4. Fail if forbidden pattern detected
        
        Example violations:
        - src/domain/aggregates/order.rs imports sqlx
        - src/application/services/user_service.rs imports infrastructure::repositories::UserRepo (should use port trait)
        
    - check: "naming_convention"
      description: "snake_case for all Rust code"
      validation: |
        Rust enforces snake_case for functions, variables, modules.
        PascalCase for types (structs, enums, traits).
        SCREAMING_SNAKE_CASE for constants.
        
    - check: "forbidden_patterns"
      description: "Check project_donts rules"
      validation: |
        Run clippy with custom lints.
        Check for unwrap() and expect() outside tests.
        Check for hardcoded secrets/URLs.

  post_generation_checks:
    - check: "error_handling_pattern"
      description: "Errors use Result<T, E> not panic"
      validation: |
        All public functions return Result.
        Only panic in unrecoverable situations.
        Use ? operator for error propagation.
        
    - check: "test_coverage_impact"
      description: "Domain logic must have tests"
      validation: |
        If adding domain logic, add tests.
        Run: cargo tarpaulin or cargo-llvm-cov.
        Target: 80% coverage for domain layer.

  cross_reference_validation:
    - rule: "modules_exist"
      description: "Referenced modules must exist"
      validation: "cargo check will fail if imports are invalid"
      
    - rule: "ports_implemented"
      description: "Infrastructure types implement port traits"
      validation: "Compiler enforces trait implementation"

  output_format:
    on_violation:
      template: |
        ⚠️ VIOLATION: {rule_id}
        File: {file_path}:{line}
        Problem: {description}
        Fix: {suggested_fix}
        
    on_success:
      template: "✅ All checks passed"

