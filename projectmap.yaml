        Template uses tracing crate for structured logging.
        Can be extended to distributed tracing with:
        - tracing-opentelemetry
        - Jaeger or Tempo backend
        
      sampling_rate: "To be defined"
      instrumented_operations: []
      span_attributes: []

    alerting:
