# ============================================================
# SECTION 1: PROJECT OVERVIEW
# ============================================================
overview:
  name: project-struct-base
  version: 0.1.0
  description: |
    A production-ready Rust project template implementing Hexagonal Architecture
    (Ports & Adapters pattern) with comprehensive infrastructure support for building
    scalable, event-driven applications.
    
    This template provides a clean separation between business logic and technical
    concerns, making it easy to swap infrastructure components, test in isolation,
    and maintain clear architectural boundaries. The template is intentionally
    generic - domain-specific logic has been removed to allow teams to implement
    their own business requirements while benefiting from battle-tested infrastructure.
    
    Key capabilities include type-safe Kafka producers/consumers with pluggable
    serialization, PostgreSQL repositories with compile-time query verification,
    graceful shutdown handling, and structured observability through tracing.

  business_domain: Template/Framework
  team_size: 1-5
  
  key_stakeholders:
    - role: Template Maintainer
      name: Not Specified
      responsibilities: "Maintain generic infrastructure and architectural patterns"
    
    - role: Template User/Developer
      name: Variable
      responsibilities: "Implement domain-specific business logic using template"

  core_capabilities:
    - capability: "Hexagonal Architecture Foundation"
      status: production
      criticality: high
      
    - capability: "Generic Kafka Messaging (Producers/Consumers)"
      status: production
      criticality: high
      
    - capability: "PostgreSQL Repository Pattern"
      status: production
      criticality: high
      
    - capability: "Event Sourcing Infrastructure"
      status: beta
      criticality: medium
      
    - capability: "Graceful Shutdown & Lifecycle Management"
      status: production
      criticality: high
      
    - capability: "Structured Logging & Observability"
      status: production
      criticality: high

# ============================================================
# SECTION 2: LAYER ARCHITECTURE
# ============================================================
architecture:
  style: hexagonal
  
  layers_hierarchy:
    - name: domain
      level: 5
      purpose: "Pure business logic with zero infrastructure dependencies"
      dependencies_allowed: []
      
    - name: application
      level: 4
      purpose: "Use case orchestration and port definitions (interfaces)"
      dependencies_allowed:
        - domain
        
    - name: infrastructure
      level: 3
      purpose: "Adapters implementing application ports for external systems"
      dependencies_allowed:
        - application
        - domain
        
    - name: shared
      level: 2
      purpose: "Cross-cutting concerns used by all layers"
      dependencies_allowed: []
      
    - name: presentation
      level: 1
      purpose: "Entry points (HTTP, CLI, etc.) - not yet implemented"
      dependencies_allowed:
        - application
        - shared

  dependency_rules:
    - "Domain MUST NOT depend on any other layer"
    - "Application depends only on Domain"
    - "Infrastructure implements Application ports"
    - "All dependencies point inward toward Domain"
    - "Shared layer contains only primitives and utilities"
    - "Infrastructure never imported directly by Domain or Application"

  layer_diagram: |
    ┌─────────────────────────────────────────────────┐
    │  Presentation (HTTP/CLI) - Not Yet Implemented  │
    │  Entry points and delivery mechanisms           │
    ├─────────────────────────────────────────────────┤
    │  Infrastructure (Adapters)                      │
    │  - Kafka Producers/Consumers                    │
    │  - PostgreSQL Repositories                      │
    │  - Config, Bootstrap, Shutdown                  │
    ├─────────────────────────────────────────────────┤
    │  Application (Use Cases & Ports)                │
    │  - Port Traits (EventStore, etc.)               │
    │  - DTOs, Services, Queries                      │
    ├─────────────────────────────────────────────────┤
    │  Domain (Business Logic) - TEMPLATE             │
    │  - Aggregates, Entities, Value Objects (empty)  │
    │  - Domain Events (empty)                        │
    │  - Repository Interfaces (empty)                │
    └─────────────────────────────────────────────────┘
              ↑
         Dependencies flow inward
         
    Note: Domain layer is intentionally empty in this template.
    Users add their business-specific logic here.

# ============================================================
# SECTION 3: BUSINESS FLOWS
# ============================================================
business_flows:
  description: |
    This is a generic template - no specific business flows are implemented.
    Below are example flows to guide template users in documenting their own.
    
  - name: "Example: Entity Creation Flow"
    trigger: "HTTP POST /api/entities (user-defined)"
    actors:
      - type: user
        name: "API Consumer"
      - type: system
        name: "Application Service"
        
    steps:
      - step: 1
        layer: presentation
        action: "Receives and validates HTTP request"
        module: "api::entities (to be implemented)"
        
      - step: 2
        layer: application
        action: "Orchestrates use case, validates business rules"
        module: "services::entity_service (to be implemented)"
        
      - step: 3
        layer: domain
        action: "Creates domain aggregate with invariants"
        module: "aggregates::entity (to be implemented)"
        
      - step: 4
        layer: infrastructure
        action: "Persists to PostgreSQL via repository"
        module: "repositories::entity_repository (to be implemented)"
        
      - step: 5
        layer: infrastructure
        action: "Publishes domain event to Kafka"
        module: "messaging::kafka::producers::base_producer"
        
    integration_points:
      - service: "Kafka Message Broker"
        protocol: kafka
        when: "After successful persistence"
        
    error_scenarios:
      - scenario: "Validation failure"
        handler: "Return 400 Bad Request with error details"
      - scenario: "Database connection failure"
        handler: "Return 503 Service Unavailable, trigger retry"
      - scenario: "Kafka publish failure"
        handler: "Log error, retry with exponential backoff"

# ============================================================
# SECTION 4: API AND CONTRACTS MAP
# ============================================================
api_contracts:
  description: |
    This template does not implement REST endpoints or specific Kafka topics.
    The infrastructure for both is provided - users define their own contracts.
    Below are structural examples and patterns to follow.

  # ─────────────────────────────────────────────────────────
  # REST ENDPOINTS (To Be Implemented)
  # ─────────────────────────────────────────────────────────
  rest_api:
    base_url: "http://localhost:8080"
    version: "Not Applicable - Template"
    default_content_type: "application/json"
    
    authentication:
      type: "To be defined by template user"
      description: "Axum 0.8.6 is included but not configured"
      
    endpoints:
      - path: "/health"
        method: GET
        summary: "Health check endpoint (example, not implemented)"
        owner_module: "infrastructure::startup::health"
        auth_required: false
        
        responses:
          - status: 200
            description: "Service is healthy"
            body_schema: |
              {
                "status": "healthy",
                "version": "0.1.0",
                "timestamp": "ISO8601"
              }
              
      - path: "/health/ready"
        method: GET
        summary: "Readiness check (example, not implemented)"
        owner_module: "infrastructure::startup::health"
        auth_required: false
        
        responses:
          - status: 200
            description: "Service is ready"
            body_schema: |
              {
                "status": "ready",
                "checks": {
                  "database": "ok",
                  "kafka": "ok"
                }
              }
          - status: 503
            description: "Service not ready"
            
    error_format:
      schema: |
        {
          "error": {
            "code": "ERROR_CODE",
            "message": "Human readable message",
            "trace_id": "uuid"
          }
        }
        
      common_error_codes:
        - code: VALIDATION_ERROR
          http_status: 400
          description: "Invalid request data"
        - code: INTERNAL_ERROR
          http_status: 500
          description: "Internal server error"

  # ─────────────────────────────────────────────────────────
  # KAFKA TOPICS
  # ─────────────────────────────────────────────────────────
  kafka:
    cluster: "To be configured"
    bootstrap_servers: ["kafka:9092"]
    
    naming_convention: "<app-name>-<topic-name>"
    
    default_config:
      partitions: 3
      replication_factor: 1
      retention_ms: 604800000  # 7 days
      cleanup_policy: delete
      
    serialization:
      key: string
      value: json
      schema_registry: "Optional - not configured by default"
      
    # ── TOPICS PUBLISHED (Examples - User Defined) ─────────
    topics_published:
      - topic: "example-app-domain-events"
        description: "Generic domain events (user-defined schema)"
        owner_module: "infrastructure::messaging::kafka::producers::base_producer"
        
        trigger: "When domain aggregates emit events"
        frequency: "Variable - depends on use case"
        
        partitioning:
          strategy: by_key
          key: aggregate_id
          reason: "Ensure ordering per aggregate"
          
        schema:
          version: "User Defined"
          compatibility: "BACKWARD (recommended)"
          fields:
            - name: event_id
              type: uuid
              required: true
              description: "Unique event identifier"
            - name: event_type
              type: string
              required: true
              description: "Type discriminator"
            - name: timestamp
              type: datetime
              required: true
              format: "ISO8601"
            - name: aggregate_id
              type: uuid
              required: true
              description: "ID of aggregate that emitted event"
            - name: payload
              type: object
              required: true
              description: "Event-specific data"
              
        consumers:
          - service: "User-defined services"
            consumer_group: "User-defined"
            purpose: "User-defined"
            
    # ── TOPICS CONSUMED (Examples - User Defined) ──────────
    topics_consumed:
      - topic: "example-app-commands"
        description: "Command messages (user-defined schema)"
        producer_service: "External or internal services"
        handler_module: "infrastructure::messaging::kafka::consumers::base_consumer"
        
        consumer_group: "example-app-command-consumer"
        
        processing:
          strategy: at_least_once
          max_retries: 3
          retry_backoff: exponential
          dead_letter_topic: "example-app-commands-dlq"
          
        expected_schema:
          version: "User Defined"
          description: "Define your command schema"
          
        actions_on_receive:
          - "Parse and validate command"
          - "Delegate to application service"
          - "Emit domain event on success"
          
    # ── MONITORING ─────────────────────────────────────────
    monitoring:
      consumer_lag_alert:
        warning_threshold: 1000
        critical_threshold: 10000
        
      throughput_baseline:
        description: "Define baseline metrics per topic"

