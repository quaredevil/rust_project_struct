# ============================================================
# SECTION 15: PATTERNS AND ANTI-PATTERNS
# ============================================================
design_patterns:
  architectural_patterns:
    - pattern: "Ports and Adapters (Hexagonal Architecture)"
      usage: "Core architectural pattern of entire template"
      locations: [application::ports, infrastructure]
      benefits:
        - "Complete isolation of business logic"
        - "Easy to test with mocked ports"
        - "Infrastructure can be swapped"
      tradeoffs:
        - "More abstractions and files"
        - "Learning curve for newcomers"
        
    - pattern: "Repository Pattern"
      usage: "Abstract data access behind traits"
      locations: [application::ports, infrastructure::repositories]
      benefits:
        - "Testable without real database"
        - "Consistent data access interface"
      tradeoffs:
        - "Boilerplate for each entity"
        
    - pattern: "CQRS"
      usage: "Separate command and query responsibilities"
      locations: [application::services, application::queries]
      benefits:
        - "Optimized reads and writes separately"
        - "Scalable read models"
      tradeoffs:
        - "Eventual consistency"
        - "More complex data flow"

  creational_patterns:
    - pattern: "Factory Method"
      usage: "Bootstrap methods create infrastructure components"
      example_module: infrastructure::messaging::kafka::producers
      scenario: "KafkaProducer::bootstrap() with retry logic"
      
    - pattern: "Builder Pattern"
      usage: "Configuration builders (via Settings)"
      example_module: infrastructure::config::settings
      scenario: "Complex configuration with many optional fields"

  behavioral_patterns:
    - pattern: "Strategy Pattern"
      usage: "Pluggable serialization via traits"
      example_module: infrastructure::messaging::kafka::common
      implementations: [MessageSerializer, MessageDeserializer]
      
    - pattern: "Observer Pattern"
      usage: "MessageHandler trait for Kafka consumers"
      example_module: infrastructure::messaging::kafka::consumers
      scenario: "Decouple message processing from consumption"

  anti_patterns:
    known_code_smells: []
    
    architectural_debt: []
    
    description: |
      Template is intentionally minimal to avoid introducing debt.
      Users should watch for these common anti-patterns:
      - Importing infrastructure in domain layer
      - Business logic in DTOs
      - God objects that do too much
      - Primitive obsession (use value objects)

  refactoring_queue: []

