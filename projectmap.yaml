# ============================================================
# SECTION 9: LAYERS (Detailed Module Documentation)
# ============================================================

# ──────────────────────────────────────────────────────────
# DOMAIN LAYER
# ──────────────────────────────────────────────────────────
domain:
  description: |
    The domain layer is the heart of the business logic, containing aggregates,
    entities, value objects, and domain events. In this template, the domain
    layer is intentionally empty - it provides the structure but no specific
    business logic. This is by design to allow template users to implement
    their own domain models without being constrained by example code.
    
    The domain layer MUST have zero infrastructure dependencies. It should
    express pure business rules and invariants using only language primitives
    and shared types.

  naming_style: snake_case
  maturity_level: stable
  
  ownership:
    team: "Template users"
    tech_lead: "N/A"
    documentation: "docs/ARCHITECTURE.md"

  modules:
    - name: aggregates
      path: src/domain/aggregates
      purpose: |
        Aggregate roots that enforce business invariants and coordinate
        entity interactions. Each aggregate is a transactional boundary.
        Currently empty - users define their own aggregates.
        
      complexity_score: 1
      test_coverage: "N/A - no implementation"
      
      directories:
        - path: src/domain/aggregates
          purpose: "Root directory for aggregate implementations"
          files:
            - mod.rs
            
      key_types: []
      
      dependencies:
        internal:
          - domain::entities
          - domain::value_objects
          - domain::events
        external:
          - uuid
          - chrono
          
      conventions:
        - "Each aggregate in its own file"
        - "Aggregates emit domain events on state changes"
        - "Enforce invariants in constructor and methods"
        - "Use value objects for complex validations"
        
    - name: entities
      path: src/domain/entities
      purpose: |
        Domain entities with identity that are not aggregate roots.
        Entities within an aggregate should reference each other by ID.
        Currently empty - users define their own entities.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/domain/entities
          purpose: "Entity type definitions"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - domain::value_objects
        external:
          - uuid
          
    - name: events
      path: src/domain/events
      purpose: |
        Domain events that represent state changes in aggregates.
        Events are immutable records of facts that have occurred.
        Currently empty - users define their own event types.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/domain/events
          purpose: "Domain event type definitions"
          files:
            - mod.rs
            
      dependencies:
        internal: []
        external:
          - serde
          - uuid
          - chrono
          
      conventions:
        - "Events are immutable (all fields read-only)"
        - "Named in past tense (OrderCreated, PaymentProcessed)"
        - "Serializable to JSON for event sourcing"
        - "Include aggregate_id and timestamp"
        
    - name: value_objects
      path: src/domain/value_objects
      purpose: |
        Immutable value objects that encapsulate validation logic.
        Value objects have no identity - equality is by value.
        Currently empty - users define their own value objects.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/domain/value_objects
          purpose: "Value object implementations"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - domain::errors
        external:
          - serde
          
      conventions:
        - "Validate in constructor, panic or return Result"
        - "Derive Eq, PartialEq, Hash, Clone"
        - "Keep small and focused"
        - "Examples: Email, Money, Address, etc."
        
    - name: repositories
      path: src/domain/repositories
      purpose: |
        Repository interface definitions (traits) that abstract persistence.
        Implementations are in infrastructure layer.
        Currently empty - users define repository traits for their aggregates.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/domain/repositories
          purpose: "Repository trait definitions"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - domain::aggregates
          - domain::errors
        external:
          - async_trait
          
      conventions:
        - "One repository trait per aggregate root"
        - "Methods return DomainResult<T>"
        - "Use async_trait for async methods"
        
    - name: services
      path: src/domain/services
      purpose: |
        Domain services for business logic that doesn't fit in a single aggregate.
        Currently empty - users add domain services as needed.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/domain/services
          purpose: "Domain service implementations"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - domain::aggregates
          - domain::entities
        external: []
        
    - name: errors
      path: src/domain/errors.rs
      purpose: |
        Domain-specific error types for business rule violations.
        Uses thiserror for ergonomic error definitions.
        
      complexity_score: 2
      test_coverage: "N/A - error definitions"
      
      key_types:
        - name: DomainError
          kind: enum
          purpose: "Top-level domain error type"
          visibility: public
          variants:
            - Validation(String)
            - NotFound(String)
            - Concurrency(String)
            
      dependencies:
        internal: []
        external:
          - thiserror
          
  conventions:
    - "NEVER import from infrastructure layer"
    - "NEVER import from application layer"
    - "Use only std, shared utilities, and domain-approved crates"
    - "Business logic expressed in domain language, not technical terms"
    - "All public types have documentation comments"
    
  interactions: []
  
  glossary_refs:
    - term: "Aggregate"
      usage: "Transactional consistency boundary"
      relevance: "Core DDD pattern for organizing domain logic"
    - term: "Value Object"
      usage: "Immutable types with validation"
      relevance: "Prevents primitive obsession"
    - term: "Domain Event"
      usage: "State change notification"
      relevance: "Enables event sourcing and loose coupling"
      
  notes:
    - "✅ Best Practice: Domain layer is dependency-free and testable"
    - "📋 TODO: Users implement their domain model here"
    - "🏗️ Architecture: Strict enforcement of hexagonal boundaries"
    - "⚠️ Warning: Do not import infrastructure in domain layer"

# ──────────────────────────────────────────────────────────
# APPLICATION LAYER
# ──────────────────────────────────────────────────────────
application:
  description: |
    The application layer orchestrates use cases by coordinating domain objects
    and infrastructure adapters through port interfaces. This layer defines
    the contracts (traits) that infrastructure must implement, and provides
    DTOs for data transfer between layers.
    
    The application layer depends only on the domain layer and defines abstract
    ports that infrastructure implements. This maintains the dependency inversion
    principle central to hexagonal architecture.

  naming_style: snake_case
  maturity_level: stable
  
  ownership:
    team: "Template users"
    tech_lead: "N/A"
    documentation: "docs/ARCHITECTURE.md"

  modules:
    - name: ports
      path: src/application/ports
      purpose: |
        Port trait definitions that infrastructure must implement.
        These are the interfaces through which the application communicates
        with external systems (databases, message brokers, etc.)
        
      complexity_score: 3
      test_coverage: "N/A - interface definitions"
      
      directories:
        - path: src/application/ports
          purpose: "Port trait definitions"
          files:
            - mod.rs
            - event_store.rs
            - projection_store.rs
            
      key_types:
        - name: EventStore
          kind: trait
          purpose: "Generic event store interface for event sourcing"
          visibility: public
          methods:
            - "async fn append(aggregate_id, events, metadata) -> Result"
            - "async fn read_stream(aggregate_id) -> Result<Vec<Event>>"
            
        - name: ProjectionStore
          kind: trait
          purpose: "Generic projection store interface for CQRS read models"
          visibility: public
          methods:
            - "async fn save_projection(projection) -> Result"
            - "async fn get_projection(id) -> Result<Option<Projection>>"
            
      dependencies:
        internal:
          - shared::errors
          - shared::types
        external:
          - async_trait
          - uuid
          - serde_json
          
      conventions:
        - "All ports are async traits"
        - "Use async_trait macro"
        - "Return InfraResult<T> from shared errors"
        - "Traits are Send + Sync"
        
    - name: dtos
      path: src/application/dtos
      purpose: |
        Data Transfer Objects for crossing layer boundaries.
        DTOs are simple data containers with no business logic.
        Currently empty - users define DTOs for their use cases.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/application/dtos
          purpose: "DTO type definitions"
          files:
            - mod.rs
            
      dependencies:
        internal: []
        external:
          - serde
          
      conventions:
        - "Derive Serialize and Deserialize"
        - "No business logic in DTOs"
        - "Map from/to domain types in application services"
        
    - name: services
      path: src/application/services
      purpose: |
        Application services that orchestrate use cases.
        Services coordinate domain objects and infrastructure ports.
        Currently empty - users implement their use cases here.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/application/services
          purpose: "Use case orchestration"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - application::ports
          - application::dtos
          - domain
        external:
          - async_trait
          
      conventions:
        - "One service per use case or feature area"
        - "Services inject port dependencies via constructor"
        - "Services coordinate, domain objects enforce rules"
        
    - name: queries
      path: src/application/queries
      purpose: |
        Query handlers for CQRS read operations.
        Queries bypass domain model for optimized reads.
        Currently empty - users implement query handlers.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/application/queries
          purpose: "CQRS query handlers"
          files:
            - mod.rs
            
      dependencies:
        internal:
          - application::ports
          - application::dtos
        external:
          - async_trait
          
      conventions:
        - "Queries never modify state"
        - "Can read directly from projection stores"
        - "Return DTOs, not domain entities"
        
  conventions:
    - "Application depends only on domain and shared"
    - "Never import concrete infrastructure types"
    - "Use dependency injection for ports"
    - "All port methods return InfraResult or AppResult"
    
  interactions:
    - from: application::services
      to: domain::aggregates
      method: direct_call
      description: "Services invoke domain logic via public aggregate methods"
      frequency: real-time
      data_volume: low
      
    - from: application::services
      to: application::ports
      method: trait_call
      description: "Services call port traits (implemented by infrastructure)"
      frequency: real-time
      data_volume: medium
      
  glossary_refs:
    - term: "Port"
      usage: "Interface that infrastructure implements"
      relevance: "Core to hexagonal architecture"
    - term: "DTO"
      usage: "Data transfer across layer boundaries"
      relevance: "Decouples layers"
    - term: "CQRS"
      usage: "Separate read and write models"
      relevance: "Performance and scalability"
      
  notes:
    - "✅ Best Practice: Ports enable testability and flexibility"
    - "📋 TODO: Users define ports and use cases for their domain"
    - "🏗️ Architecture: Dependency inversion via port traits"

# ──────────────────────────────────────────────────────────
# INFRASTRUCTURE LAYER
# ──────────────────────────────────────────────────────────
infrastructure:
  description: |
    The infrastructure layer contains all adapters that implement application
    ports and interact with external systems. This includes Kafka producers/
    consumers, PostgreSQL repositories, configuration management, and lifecycle
    management (bootstrap, startup, shutdown).
    
    This is the most complete layer in the template, providing production-ready
    implementations that can be used as-is or customized for specific needs.

  naming_style: snake_case
  maturity_level: production
  
  ownership:
    team: "Template maintainers"
    tech_lead: "N/A"
    documentation: "docs/ARCHITECTURE.md, docs/GETTING_STARTED.md"

  modules:
    - name: messaging
      path: src/infrastructure/messaging
      purpose: |
        Complete Kafka infrastructure with generic producers and consumers.
        Supports pluggable serialization, retry logic, batching, and graceful
        shutdown. Type-safe implementation using Rust generics.
        
      complexity_score: 8
      test_coverage: "60% (estimated)"
      
      directories:
        - path: src/infrastructure/messaging/kafka
          purpose: "Kafka-specific implementations"
          files:
            - mod.rs
            - common.rs
            - config.rs
            
        - path: src/infrastructure/messaging/kafka/producers
          purpose: "Generic Kafka producers"
          files:
            - mod.rs
            - base_producer.rs
            - batching_producer.rs
            
        - path: src/infrastructure/messaging/kafka/consumers
          purpose: "Generic Kafka consumers"
          files:
            - mod.rs
            - base_consumer.rs
            
      key_types:
        - name: KafkaProducer<T, S>
          kind: struct
          purpose: "Generic Kafka producer with type-safe messages and pluggable serialization"
          visibility: public
          
        - name: KafkaProducerPort<T>
          kind: trait
          purpose: "Port trait for Kafka producers"
          visibility: public
          
        - name: KafkaConsumer<T, D, H>
          kind: struct
          purpose: "Generic Kafka consumer with deserializer and message handler"
          visibility: public
          
        - name: KafkaConsumerPort
          kind: trait
          purpose: "Port trait for Kafka consumers"
          visibility: public
          
        - name: MessageSerializer<T>
          kind: trait
          purpose: "Pluggable serialization strategy"
          visibility: public
          
        - name: MessageDeserializer<T>
          kind: trait
          purpose: "Pluggable deserialization strategy"
          visibility: public
          
        - name: MessageHandler<T>
          kind: trait
          purpose: "Handler for consumed messages"
          visibility: public
          
      dependencies:
        internal:
          - shared::errors
          - infrastructure::config
        external:
          - rdkafka
          - tokio
          - async_trait
          - tracing
          
      performance_notes:
        - "Batching producer buffers messages for high throughput"
        - "Async channel between send() and actual Kafka publish"
        - "Retry logic with exponential backoff configurable"
        - "Connection pooling handled by rdkafka"
        
      conventions:
        - "Use Arc<Self> for shared ownership"
        - "Bootstrap method with retry logic"
        - "Graceful shutdown via shutdown() method"
        - "Health check method for readiness probes"
        
    - name: repositories
      path: src/infrastructure/repositories
      purpose: |
        Repository implementations using PostgreSQL and SQLx.
        Provides base Repository<T> trait and PostgresRepository base type.
        Users implement the trait for their specific entities.
        
      complexity_score: 5
      test_coverage: "N/A - example implementation"
      
      directories:
        - path: src/infrastructure/repositories
          purpose: "Repository implementations"
          files:
            - mod.rs
            - base_repository.rs
            
      key_types:
        - name: Repository<T>
          kind: trait
          purpose: "Generic CRUD interface for entities"
          visibility: public
          methods:
            - "async fn find_by_id(id) -> Result<Option<T>>"
            - "async fn find_all() -> Result<Vec<T>>"
            - "async fn save(entity) -> Result<()>"
            - "async fn update(entity) -> Result<()>"
            - "async fn delete(id) -> Result<()>"
            
        - name: PostgresRepository
          kind: struct
          purpose: "Base PostgreSQL repository with connection pool"
          visibility: public
          
      dependencies:
        internal:
          - shared::errors
        external:
          - sqlx
          - async_trait
          
      conventions:
        - "Implement Repository<T> for each entity"
        - "Use compile-time verified queries with sqlx::query!"
        - "Return InfraResult<T>"
        - "Pool managed at application level, injected via constructor"
        
    - name: bootstrap
      path: src/infrastructure/bootstrap
      purpose: |
        Component initialization with retry logic for resilient startup.
        Handles database connections and other external dependencies that
        may not be immediately available (e.g., in container environments).
        
      complexity_score: 6
      test_coverage: "50%"
      
      directories:
        - path: src/infrastructure/bootstrap
          purpose: "Component bootstrap implementations"
          files:
            - mod.rs
            - database.rs
            
      key_types:
        - name: DatabaseBootstrap
          kind: struct
          purpose: "PostgreSQL connection with retry logic"
          visibility: public
          methods:
            - "async fn connect(max_attempts, retry_delay) -> PgPool"
            
      dependencies:
        internal:
          - shared::errors
        external:
          - sqlx
          - tokio
          - tracing
          
      performance_notes:
        - "Exponential backoff between retry attempts"
        - "Configurable max attempts and delay"
        - "Validates connection before returning"
        
    - name: startup
      path: src/infrastructure/startup
      purpose: |
        Application startup utilities including logging initialization,
        startup banner display, and health check aggregation for providing
        visibility into application state at launch.
        
      complexity_score: 4
      test_coverage: "40%"
      
      directories:
        - path: src/infrastructure/startup
          purpose: "Startup utilities"
          files:
            - mod.rs
            - logging.rs
            - banner.rs
            - health.rs
            
      key_types:
        - name: LoggingSetup
          kind: struct
          purpose: "Structured logging initialization"
          visibility: public
          methods:
            - "fn initialize() - Sets up tracing subscriber"
            
        - name: StartupBanner
          kind: struct
          purpose: "Display startup information"
          visibility: public
          
        - name: HealthChecker
          kind: struct
          purpose: "Aggregate health check results"
          visibility: public
          
      dependencies:
        internal: []
        external:
          - tracing
          - tracing_subscriber
          
      conventions:
        - "Initialize logging before any other operations"
        - "Structured JSON logs for production"
        - "Pretty console logs for development"
        
    - name: shutdown
      path: src/infrastructure/shutdown
      purpose: |
        Graceful shutdown coordination for ensuring clean resource cleanup.
        Handles OS signals (SIGTERM, SIGINT) and coordinates shutdown of
        all application components with configurable timeout.
        
      complexity_score: 5
      test_coverage: "50%"
      
      directories:
        - path: src/infrastructure/shutdown
          purpose: "Shutdown handlers"
          files:
            - mod.rs
            - signal_handler.rs
            - graceful.rs
            
      key_types:
        - name: SignalHandler
          kind: struct
          purpose: "OS signal handling (SIGTERM, SIGINT)"
          visibility: public
          
        - name: GracefulShutdown
          kind: struct
          purpose: "Coordinated component shutdown"
          visibility: public
          methods:
            - "async fn shutdown() - Execute shutdown sequence"
            
      dependencies:
        internal: []
        external:
          - tokio
          - tracing
          
      conventions:
        - "Components implement shutdown() method"
        - "Shutdown in reverse order of initialization"
        - "Timeout prevents indefinite hangs"
        
    - name: config
      path: src/infrastructure/config
      purpose: |
        Configuration management with environment variable support.
        Supports .env files, environment variables, and config files
        with hierarchical precedence. Type-safe settings with validation.
        
      complexity_score: 7
      test_coverage: "N/A - configuration"
      
      directories:
        - path: src/infrastructure/config
          purpose: "Configuration types and loading"
          files:
            - mod.rs
            - settings.rs
            
      key_types:
        - name: Settings
          kind: struct
          purpose: "Application configuration"
          visibility: public
          fields:
            - app: AppSettings
            - kafka: KafkaSettings
            - topics: TopicsConfig
            - kafka_producers: HashMap<String, KafkaProducerSettings>
            - kafka_consumers: HashMap<String, KafkaConsumerSettings>
            - market: MarketSettings
            - database: DatabaseSettings
            
        - name: KafkaProducerConfig
          kind: struct
          purpose: "Configuration for individual Kafka producer"
          visibility: public
          
        - name: KafkaConsumerConfig
          kind: struct
          purpose: "Configuration for individual Kafka consumer"
          visibility: public
          
      dependencies:
        internal: []
        external:
          - config
          - dotenvy
          - serde
          
      conventions:
        - "Load from environment variables first"
        - "Fall back to .env file"
        - "Provide sensible defaults"
        - "HashMap for multiple producers/consumers"
        
    - name: event_store
      path: src/infrastructure/event_store
      purpose: |
        Event store implementation for event sourcing pattern.
        Provides in-memory implementation for testing and as a reference
        for persistent implementations (PostgreSQL, EventStoreDB, etc.)
        
      complexity_score: 6
      test_coverage: "70%"
      
      directories:
        - path: src/infrastructure/event_store
          purpose: "Event store implementations"
          files:
            - mod.rs
            - in_memory_event_store.rs
            
      key_types:
        - name: InMemoryEventStore
          kind: struct
          purpose: "In-memory event store for testing"
          visibility: public
          
      dependencies:
        internal:
          - application::ports::event_store
          - shared::errors
          - shared::types
        external:
          - parking_lot
          - uuid
          - serde_json
          
      conventions:
        - "Implements EventStore port trait"
        - "Thread-safe with RwLock"
        - "Append-only semantics"
        
  conventions:
    - "All infrastructure types implement application port traits"
    - "Use Arc<Self> for shared ownership in async contexts"
    - "Bootstrap methods with retry logic and configurable parameters"
    - "Health check methods return InfraResult<()>"
    - "Graceful shutdown via shutdown() method on ports"
    - "Generic implementations using Rust type parameters"
    - "Pluggable strategies via trait abstractions"
    
  interactions:
    - from: infrastructure::messaging::kafka::producers
      to: kafka
      method: kafka
      description: "Publish messages to Kafka topics"
      frequency: real-time
      data_volume: high
      
    - from: infrastructure::messaging::kafka::consumers
      to: kafka
      method: kafka
      description: "Consume messages from Kafka topics"
      frequency: real-time
      data_volume: high
      
    - from: infrastructure::repositories
      to: postgresql
      method: db
      description: "Execute SQL queries via connection pool"
      frequency: real-time
      data_volume: medium
      
    - from: infrastructure::bootstrap::database
      to: postgresql
      method: db
      description: "Establish connection pool with retry"
      frequency: on-demand
      data_volume: low
      
  glossary_refs:
    - term: "Adapter"
      usage: "Infrastructure implementations of application ports"
      relevance: "Core hexagonal architecture pattern"
    - term: "Bootstrap"
      usage: "Resilient component initialization"
      relevance: "Handles container timing issues"
    - term: "Generic"
      usage: "Type-safe, reusable implementations"
      relevance: "Reduces code duplication"
      
  notes:
    - "✅ Best Practice: Retry logic makes deployments resilient"
    - "✅ Best Practice: Generic producers/consumers are type-safe"
    - "🔥 Hotspot: Kafka producer/consumer are most complex components"
    - "📋 TODO: Add PostgreSQL event store implementation"
    - "🏗️ Architecture: All infrastructure implements port traits"
    - "⚠️ Warning: Ensure proper shutdown to flush Kafka producers"

# ──────────────────────────────────────────────────────────
# SHARED LAYER
# ──────────────────────────────────────────────────────────
shared:
  description: |
    The shared layer contains common utilities, types, traits, and error
    definitions used across all layers. This is kept minimal to avoid
    creating a "big ball of mud" shared kernel.
    
    Only truly cross-cutting concerns belong here - things that are needed
    by multiple layers and don't fit naturally in any single layer.

  naming_style: snake_case
  maturity_level: stable
  
  ownership:
    team: "Template maintainers"
    tech_lead: "N/A"
    documentation: "Inline documentation"

  modules:
    - name: errors
      path: src/shared/errors.rs
      purpose: |
        Common error types for domain, application, and infrastructure layers.
        Uses thiserror for ergonomic error definitions with automatic
        conversions between error types.
        
      complexity_score: 3
      test_coverage: "N/A - error definitions"
      
      key_types:
        - name: DomainError
          kind: enum
          purpose: "Domain-level errors (business rule violations)"
          visibility: public
          variants:
            - Validation(String)
            - NotFound(String)
            - Concurrency(String)
            
        - name: ApplicationError
          kind: enum
          purpose: "Application-level errors"
          visibility: public
          variants:
            - Domain(DomainError)
            - Infrastructure(InfrastructureError)
            - Serde(serde_json::Error)
            
        - name: InfrastructureError
          kind: enum
          purpose: "Infrastructure-level errors (I/O, external systems)"
          visibility: public
          variants:
            - Database(String)
            - EventStore(String)
            - Io(String)
            - Messaging(String)
            - WebSocket(String)
            - Kafka(String)
            - Serialization(String)
            
        - name: DomainResult<T>
          kind: type
          purpose: "Alias for Result<T, DomainError>"
          visibility: public
          
        - name: AppResult<T>
          kind: type
          purpose: "Alias for Result<T, ApplicationError>"
          visibility: public
          
        - name: InfraResult<T>
          kind: type
          purpose: "Alias for Result<T, InfrastructureError>"
          visibility: public
          
      dependencies:
        internal: []
        external:
          - thiserror
          - serde_json
          
    - name: types
      path: src/shared/types.rs
      purpose: |
        Common type aliases and basic types used across layers.
        Includes event envelope types for event sourcing.
        
      complexity_score: 2
      test_coverage: "N/A"
      
      key_types:
        - name: EventEnvelope<T>
          kind: struct
          purpose: "Wrapper for events with metadata"
          visibility: public
          
        - name: EventMetadata
          kind: struct
          purpose: "Event metadata (timestamp, correlation ID, etc.)"
          visibility: public
          
      dependencies:
        internal: []
        external:
          - uuid
          - chrono
          - serde
          
    - name: traits
      path: src/shared/traits
      purpose: |
        Common trait definitions that don't belong to a specific layer.
        Currently empty - users add as needed.
        
      complexity_score: 1
      test_coverage: "N/A"
      
      directories:
        - path: src/shared/traits
          purpose: "Common trait definitions"
          files:
            - mod.rs
            
      dependencies:
        internal: []
        external: []
        
    - name: utils
      path: src/shared/utils
      purpose: |
        Utility functions for common operations like datetime handling
        and validation. Kept minimal to avoid utility bloat.
        
      complexity_score: 2
      test_coverage: "60%"
      
      directories:
        - path: src/shared/utils
          purpose: "Utility functions"
          files:
            - mod.rs
            - datetime.rs
            - validation.rs
            
      dependencies:
        internal: []
        external:
          - chrono
          
  conventions:
    - "Keep shared layer minimal"
    - "No business logic in shared"
    - "Only truly cross-cutting concerns"
    - "Well-documented public API"
    
  interactions: []
  
  glossary_refs:
    - term: "Shared Kernel"
      usage: "Common code across bounded contexts"
      relevance: "DDD pattern for shared concepts"
      
  notes:
    - "✅ Best Practice: Minimal shared layer prevents coupling"
    - "⚠️ Warning: Don't turn this into a junk drawer"
    - "📋 TODO: Add only what's truly needed across all layers"

# ============================================================
# SECTION 10: ROADMAP AND EVOLUTION
# ============================================================
