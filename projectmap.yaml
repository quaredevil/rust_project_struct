# ============================================================
# SECTION 11: DATA AND MODELS MAP
# ============================================================
data_model:
  persistence_strategy: hybrid
  
  description: |
    The template provides infrastructure for multiple persistence strategies:
    - CRUD via Repository<T> trait
    - Event Sourcing via EventStore port
    - CQRS via separate command/query models
    
    Actual data models are user-defined.

  entities:
    - name: "User-Defined Entities"
      type: aggregate_root
      layer: domain
      table_schema: "Users define schema"
      description: "Template provides structure, not implementation"
      
      attributes: []
      relationships: []
      invariants: []
      events_emitted: []

  value_objects:
    - name: "User-Defined Value Objects"
      layer: domain
      purpose: "Encapsulate validation and business rules"
      validation_rules: []

  dtos:
    - name: "User-Defined DTOs"
      layer: application
      purpose: "Data transfer between layers"
      source: "domain entities"
      target: "presentation layer"
      mappings: []

  database_schemas:
    - schema_name: "public"
      database: postgres
      tables: []
      description: "Users define their own schema based on domain model"
      
  data_migrations:
    - id: "User-managed"
      description: "Use SQLx migrations or Flyway for schema migrations"
      applied_at: "N/A"
      rollback_available: yes

# ============================================================
# SECTION 12: SECURITY AND COMPLIANCE
# ============================================================
security:
  authentication:
    strategy: "Not implemented - user-defined"
    provider: custom
    description: |
      Template does not implement authentication. Users should add:
      - JWT validation middleware
      - OAuth2 integration
      - API key validation
      - Or other authentication as needed

  authorization:
    model: "Not implemented - user-defined"
    description: |
      Template does not implement authorization. Consider:
      - RBAC (Role-Based Access Control)
      - ABAC (Attribute-Based Access Control)
      - Policy-based authorization
      
    roles: []
    policies: []

  data_protection:
    encryption:
      at_rest: no
      description: "PostgreSQL can be configured for encryption at rest"
      
      at_transit: yes
      protocol: TLS_1.3
      description: "Use TLS for PostgreSQL and Kafka connections"
      
    pii_fields: []
    
    data_retention:
      - data_type: "User-defined"
        retention_period: "User-defined"
        deletion_method: "User-defined"

  compliance:
    regulations: []
    description: "Users must implement compliance based on their requirements"
    
    gdpr_features:
      right_to_access: not_implemented
      right_to_erasure: not_implemented
      right_to_portability: not_implemented
      consent_management: not_implemented
      
    audit_logging:
      enabled: partial
      description: "Structured logging via tracing - users add audit events"
      events_tracked: []
      retention: "User-defined"
      storage: "stdout/stderr (structured JSON)"

  vulnerabilities:
    scanning_frequency: on_demand
    tools: [cargo-audit]
    description: "Run 'cargo audit' to check for known vulnerabilities"
    
    known_issues: []

# ============================================================
# SECTION 13: TESTING STRATEGY
# ============================================================
testing_strategy:
  description: |
    Template provides structure for testing but minimal test implementations.
    Users should add tests for their domain logic and use cases.

  test_pyramid:
    unit_tests:
      coverage_target: 80%
      current_coverage: "N/A - no business logic"
      framework: cargo_test
      location: "src/**/*_test.rs or tests/"
      naming_convention: "test_<scenario>_<expected_result>"
      
      mocking_strategy: mockall
      description: |
        Domain logic should have extensive unit tests.
        Use mockall for mocking infrastructure ports.
        
      key_areas:
        - "domain::aggregates (should be 90%+)"
        - "domain::value_objects (should be 100%)"
        - "application::services (test with mocked ports)"

    integration_tests:
      coverage_target: 50%
      current_coverage: "0%"
      location: "tests/integration/"
      description: |
        Test infrastructure components with real dependencies.
        Use testcontainers for PostgreSQL and Kafka.
        
      test_databases:
        - type: testcontainers
          setup: automatic
          cleanup: per_test
          description: "Recommended for integration tests"

      external_mocks:
        - service: kafka
          tool: testcontainers
          scenarios: []

    e2e_tests:
      coverage_target: 20%
      current_coverage: "0%"
      location: "tests/e2e/"
      description: |
        End-to-end tests with full application stack.
        Use docker-compose for test environment.

  test_data_management:
    fixtures:
      location: "tests/fixtures/"
      format: json
      description: "Users add fixtures for their domain entities"

    factories:
      - name: "User-defined factories"
        module: "tests::factories"
        purpose: "Generate test data with sensible defaults"

  performance_tests:
    load_testing:
      tool: "To be defined (k6, locust, etc.)"
      scenarios: []
      description: "Users add performance tests for critical paths"

    benchmarks:
      framework: criterion
      location: "benches/"
      description: "Add criterion benchmarks for performance-critical code"
      key_operations: []

  mutation_testing:
    tool: cargo-mutants
    description: "Consider adding mutation testing for critical domain logic"
    threshold: "70%"
    current_score: "N/A"
    exempted_modules: []

# ============================================================
# SECTION 14: ERROR HANDLING AND OBSERVABILITY
# ============================================================
error_handling:
  error_hierarchy:
    - name: DomainError
      layer: domain
      variants:
        - InvalidEmail
        - OrderAlreadyProcessed
        - InsufficientStock
      propagation: "Never crosses layer boundary directly"
      description: "Business rule violations"

    - name: ApplicationError
      layer: application
      wraps: [DomainError, InfrastructureError]
      variants:
        - ValidationFailed
        - UseCaseExecutionFailed
      propagation: "Converted to HTTP status or logged"
      description: "Application-level errors"

    - name: InfrastructureError
      layer: infrastructure
      variants:
        - DatabaseConnectionFailed
        - ExternalServiceTimeout
        - CacheUnavailable
        - Kafka
        - Serialization
      propagation: "Wrapped by ApplicationError"
      description: "Technical errors from external systems"

  error_conversion:
    - from: "DomainError::Validation"
      to: "HTTP 400 Bad Request (when HTTP layer added)"
      message_strategy: expose_details
      
    - from: "InfrastructureError::Database"
      to: "HTTP 503 Service Unavailable"
      message_strategy: hide_details
      logged_context: "Full error with stack trace"

  recovery_strategies:
    - error_type: "Kafka connection failure"
      strategy: retry_with_exponential_backoff
      max_attempts: 5
      backoff: "500ms, 1s, 2s, 4s, 8s"
      fallback: "Log error and alert"
      
    - error_type: "Database connection failure"
      strategy: retry_with_backoff
      max_attempts: 5
      backoff: "Configurable via settings"
      fallback: "Application fails to start"
      
    - error_type: "Domain validation failure"
      strategy: fail_fast
      response: "immediate error response"

  observability:
    logging:
      framework: tracing
      description: |
        Structured logging with tracing and tracing-subscriber.
        JSON format for production, pretty format for development.
        
      levels:
        - level: ERROR
          conditions: "Unrecoverable errors, panics"
          includes: [error_type, context, trace_id]
          
        - level: WARN
          conditions: "Retries, degraded service, configuration issues"
          includes: [context, attempt_count]
          
        - level: INFO
          conditions: "Lifecycle events, startup, shutdown"
          includes: [event_type, component]
          
        - level: DEBUG
          conditions: "Development debugging"
          includes: [detailed_context]
          
      structured_logging: yes
      correlation_id: "Users can add correlation ID middleware"
      pii_scrubbing: "Users must implement for sensitive data"

    metrics:
      backend: "Not implemented - users can add Prometheus"
      description: |
        Template does not include metrics. Recommended additions:
        - Prometheus exporter
        - Business metrics (orders created, etc.)
        - Technical metrics (request latency, error rate)
        
      business_metrics: []
      technical_metrics: []
      sli_slo: []

    tracing:
